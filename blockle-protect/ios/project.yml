# XcodeGen spec for Blockle Protect (iOS). CI runs `xcodegen generate`.
name: BlockleProtect
options:
  bundleIdPrefix: org.blockle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Three configurations. `Demo` exists ONLY to build the App Review copy in which
# every paid feature is unlocked without a purchase — the DEMO_UNLOCK flag is
# set here and nowhere else, so a Release build physically cannot contain it.
configs:
  Debug: debug
  Release: release
  Demo: release
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: B87ALX4XW9
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
  configs:
    Demo:
      # Drives Entitlement.isDemoUnlock and the on-screen banner. Set here and
      # nowhere else, so a Release build cannot contain it.
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEMO_UNLOCK"
targets:
  BlockleProtect:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources   # XcodeGen auto-classifies Assets.xcassets as a resource
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.blockle.protect
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_TESTABILITY: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Blockle Protect"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock your private vault with Face ID."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Pick a photo to protect. Your original stays in your library, untouched."
        # Export compliance: the app uses ONLY standard, published algorithms
        # (AES-256, ML-KEM-768, ML-DSA-65, SHA-384) — exempt encryption — so no
        # per-build compliance prompt. Review with legal; flip to YES if you must
        # self-classify / file an annual report.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
      configs:
        Demo:
          # Identifiable on the home screen and in TestFlight, not only once
          # the app is open.
          INFOPLIST_KEY_CFBundleDisplayName: "Protect DEMO"
    # Background app refresh, so a filter switched off in Settings can be
    # noticed without the user opening the app. Declared as an explicit plist
    # rather than INFOPLIST_KEY_* settings because both of these keys are
    # ARRAYS: injected build settings would land as plain strings and
    # BGTaskScheduler would then reject the identifier at runtime — a silent
    # failure, which is the exact failure mode this whole feature exists to
    # avoid. The version keys are pinned to the build settings so the plist
    # cannot drift from MARKETING_VERSION / CURRENT_PROJECT_VERSION.
    info:
      # Outside Sources/ and Resources/ on purpose — both are glob-included as
      # build inputs, and a plist sitting in one of them gets picked up as a
      # bundled resource as well as the target's Info.plist.
      path: BlockleProtect-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [org.blockle.protect.refresh]
    entitlements:
      path: BlockleProtect.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.org.blockle.protect]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.org.blockle.protect]
        com.apple.developer.icloud-services: [CloudDocuments]
        # Shared container so the app can hand a user-authored (and family-synced)
        # blocklist to the dynamic ShieldCustom content-blocker extension.
        com.apple.security.application-groups: [group.org.blockle.protect]
    dependencies:
      - target: ShieldCore
        embed: true
      - target: ShieldCustom
        embed: true
      - target: ShieldAdult1
        embed: true
      - target: ShieldAdult2
        embed: true
      - target: ShieldAdult3
        embed: true
      - target: ShieldAdult4
        embed: true

  # ---- Safari content-blocker extensions (Family Protection) ----------------
  # Each bundles its own packed blockerList.json (fetched in CI). Static +
  # independent: no App Group, and one oversized category can't break another.
  ShieldCore:
    type: app-extension
    platform: iOS
    sources:
      - path: Blockers/Shared
      - path: Blockers/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.blockle.protect.shieldCore
    info:
      path: Blockers/Core/Info.plist
      properties:
        CFBundleDisplayName: "Blockle Shield — Gambling & Scams"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
  # ---- Dynamic "My List" content blocker -------------------------------------
  # Unlike the static category blockers, this one reads its packed rule list from
  # the shared App Group container at runtime, so the user (or a family head)
  # can add their own sites and have them blocked in Safari. The app writes
  # custom-blockerList.json into the group and calls reloadContentBlocker.
  ShieldCustom:
    type: app-extension
    platform: iOS
    sources:
      - path: Blockers/Custom
    entitlements:
      path: ShieldCustom.entitlements
      properties:
        com.apple.security.application-groups: [group.org.blockle.protect]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.blockle.protect.shieldCustom
    info:
      path: Blockers/Custom/Info.plist
      properties:
        CFBundleDisplayName: "Blockle Shield — My List"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CustomBlockerRequestHandler

  ShieldAdult1:
    type: app-extension
    platform: iOS
    sources:
      - path: Blockers/Shared
      - path: Blockers/Adult1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.blockle.protect.shieldAdult1
    info:
      path: Blockers/Adult1/Info.plist
      properties:
        CFBundleDisplayName: "Blockle Shield — Adult (1/4)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
  ShieldAdult2:
    type: app-extension
    platform: iOS
    sources:
      - path: Blockers/Shared
      - path: Blockers/Adult2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.blockle.protect.shieldAdult2
    info:
      path: Blockers/Adult2/Info.plist
      properties:
        CFBundleDisplayName: "Blockle Shield — Adult (2/4)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
  ShieldAdult3:
    type: app-extension
    platform: iOS
    sources:
      - path: Blockers/Shared
      - path: Blockers/Adult3
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.blockle.protect.shieldAdult3
    info:
      path: Blockers/Adult3/Info.plist
      properties:
        CFBundleDisplayName: "Blockle Shield — Adult (3/4)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler
  ShieldAdult4:
    type: app-extension
    platform: iOS
    sources:
      - path: Blockers/Shared
      - path: Blockers/Adult4
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.blockle.protect.shieldAdult4
    info:
      path: Blockers/Adult4/Info.plist
      properties:
        CFBundleDisplayName: "Blockle Shield — Adult (4/4)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler

  BlockleProtectTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CryptoVectorsTests.swift
      - path: Tests/golden-vectors.json
        buildPhase: resources
    dependencies:
      - target: BlockleProtect
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.blockle.protect.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BlockleProtect:
    build:
      targets:
        BlockleProtect: all
    test:
      targets:
        - BlockleProtectTests
      gatherCoverageData: false
