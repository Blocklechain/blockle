# XcodeGen spec for Blockle Protect (iOS). CI runs `xcodegen generate`.
name: BlockleProtect
options:
  bundleIdPrefix: org.blockle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: B87ALX4XW9
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
targets:
  BlockleProtect:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources   # XcodeGen auto-classifies Assets.xcassets as a resource
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.blockle.protect
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_TESTABILITY: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Blockle Protect"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Unlock your private vault with Face ID."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Pick a photo to protect. Your original stays in your library, untouched."
        # Export compliance: the app uses ONLY standard, published algorithms
        # (AES-256, ML-KEM-768, ML-DSA-65, SHA-384) — exempt encryption — so no
        # per-build compliance prompt. Review with legal; flip to YES if you must
        # self-classify / file an annual report.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
  BlockleProtectTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CryptoVectorsTests.swift
      - path: Tests/golden-vectors.json
        buildPhase: resources
    dependencies:
      - target: BlockleProtect
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.blockle.protect.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BlockleProtect:
    build:
      targets:
        BlockleProtect: all
    test:
      targets:
        - BlockleProtectTests
      gatherCoverageData: false
