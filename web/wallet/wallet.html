<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/wallet/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b14">
<!-- Content-Security-Policy: a non-custodial key-holding page. script-src is strict
     ('self' + wasm, NO 'unsafe-inline') so an injected inline <script> or inline event
     handler cannot run — the primary defense against XSS key theft. style-src allows
     inline styles; img-src allows remote token/NFT art; connect-src covers 'self' plus
     the hosted agent gateway + every chain RPC/relay the wallet must reach. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Blockle Web Wallet — a non-custodial, installable wallet for BLOCK and every chain, with the Blockle agent, bots, DEX, bridge and USDB built in. Your keys never leave your device.">
<title>Blockle Wallet</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="vendor/world-token.svg">
<style>
/* ---- design tokens ---------------------------------------------------- */
:root{
  --bg:#0b0b14; --bg2:#11121d; --surface:#15172544; --card:#171a2b; --card2:#1d2135;
  --line:#272b42; --line2:#333856;
  --ink:#eef0fb; --ink2:#a6abce; --ink3:#6f759b;
  --accent:#3ddc97; --accent2:#22b573; --accent-ink:#04120b;
  --indigo:#6d8bff; --violet:#9b7bff;
  --good:#3ddc97; --warn:#f4c04e; --bad:#ff6b6b; --info:#6d8bff;
  --r:16px; --r2:12px; --r3:9px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
  --shadow:0 18px 50px -24px #000, 0 2px 8px -2px #0008;
  --maxw:1160px;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#f3f4fb; --bg2:#ffffff; --surface:#ffffffcc; --card:#ffffff; --card2:#f6f7fc;
    --line:#e4e6f2; --line2:#d3d7ea;
    --ink:#161a2e; --ink2:#4b5178; --ink3:#878daf;
    --accent:#17b06b; --accent2:#0e9257; --accent-ink:#ffffff;
    --shadow:0 18px 50px -30px #8a90c044, 0 2px 8px -4px #4b517822;
  }
}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b0b14;--bg2:#11121d;--card:#171a2b;--card2:#1d2135;--line:#272b42;--ink:#eef0fb;--ink2:#a6abce;--ink3:#6f759b;--accent:#3ddc97;--accent-ink:#04120b;}
:root[data-theme="light"]{color-scheme:light;--bg:#f3f4fb;--bg2:#fff;--card:#fff;--card2:#f6f7fc;--line:#e4e6f2;--ink:#161a2e;--ink2:#4b5178;--ink3:#878daf;--accent:#17b06b;--accent-ink:#fff;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 700px at 80% -10%,#1b2140 0%,transparent 60%),var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.ic-svg{display:inline-block;vertical-align:middle;flex:none}
.btn .ic-svg{margin:0}
.navlink .ic{display:flex;align-items:center;justify-content:center}
.navlink .ic .ic-svg,.botnav .ic-svg{display:block}
.navlink .tag .ic-svg{display:block}
.ico .ic-svg{color:var(--ink2)}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}.dim{color:var(--ink3)}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.02em;text-wrap:balance}
.hide{display:none!important}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{display:flex;flex-wrap:wrap;gap:10px}

/* ---- buttons ---------------------------------------------------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--card2);color:var(--ink);padding:10px 15px;border-radius:var(--r3);font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;border:1px solid var(--line2);font-size:12px;font-weight:600;color:var(--ink2);background:var(--card2)}
.chip.good{color:var(--good);border-color:#2b6b4d}
.chip.pro{color:var(--accent-ink);background:linear-gradient(180deg,var(--violet),var(--indigo));border:0}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--ink2)}

/* ---- layout ----------------------------------------------------------- */
#app{min-height:100%}
.topbar{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
.topbar .inner{max-width:var(--maxw);margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;font-weight:750;letter-spacing:-.02em}
.brand .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--indigo));display:grid;place-items:center;color:#04120b;font-weight:800}
.shell{max-width:var(--maxw);margin:0 auto;padding:18px;display:grid;grid-template-columns:208px 1fr;gap:18px;align-items:start}
.sidenav{position:sticky;top:70px;display:flex;flex-direction:column;gap:3px}
.navlink{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--ink2);font-weight:600;border:1px solid transparent}
.navlink .ic{width:20px;text-align:center;opacity:.9}
.navlink:hover{background:var(--card)}
.navlink.active{background:var(--card);color:var(--ink);border-color:var(--line)}
.navlink .tag{margin-left:auto;font-size:10px;font-weight:700;color:var(--violet)}
.main{min-width:0}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
.grid{display:grid;gap:14px}
.sechead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sechead h2{font-size:19px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.ico{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;background:var(--card2);border:1px solid var(--line);position:relative;overflow:hidden}
.ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.empty{color:var(--ink3);text-align:center;padding:26px 10px;font-size:14px}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--line2);color:var(--ink);padding:11px 13px;border-radius:var(--r3);font-family:inherit;font-size:15px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label{font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.hero-bal{font-size:40px;font-weight:750;letter-spacing:-.03em}
.statline{display:flex;gap:22px;flex-wrap:wrap;margin-top:6px}
.stat .n{font-size:20px;font-weight:700}
.stat .l{font-size:12px;color:var(--ink3)}

/* selector + tabs */
.selbtn{display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:999px;background:var(--card2);border:1px solid var(--line2);font-weight:600}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{padding:9px 13px;border-bottom:2px solid transparent;color:var(--ink2);font-weight:600;white-space:nowrap}
.tab.active{color:var(--ink);border-color:var(--accent)}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:#05060cc9;z-index:60;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
@media(min-width:720px){.scrim{align-items:center}}
.sheet{width:100%;max-width:460px;background:var(--bg2);border:1px solid var(--line2);border-radius:18px 18px 0 0;padding:20px;box-shadow:var(--shadow);max-height:90vh;overflow:auto;animation:up .2s ease}
@media(min-width:720px){.sheet{border-radius:18px}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}

/* toast */
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--card2);border:1px solid var(--line2);color:var(--ink);padding:10px 16px;border-radius:999px;box-shadow:var(--shadow);font-weight:600;font-size:14px;animation:up .2s}
.toast.bad{border-color:var(--bad);color:var(--bad)}
.toast.good{border-color:var(--accent)}

/* onboarding overlay */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 600px at 50% -10%,#1b2140,transparent 60%),var(--bg)}
.onbox{width:100%;max-width:440px}
.seedgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.seedgrid span{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:13px}
.seedgrid b{color:var(--ink3);margin-right:6px}

/* warning banner */
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:12px;font-size:13px;line-height:1.45}
.banner.warn{background:#3a2e0e55;border:1px solid #6b5a1e;color:#f0d79a}
.banner.info{background:#1a2550;border:1px solid #2c3d78;color:#b9c6ff}
.banner.danger{background:#3a1420;border:1px solid #7a2436;color:#ffb3b8}

/* bottom nav (mobile) */
.botnav{display:none}
@media(max-width:860px){
  .shell{grid-template-columns:1fr;padding:12px 12px 86px}
  .sidenav{display:none}
  .botnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);justify-content:space-around;padding:7px 4px env(safe-area-inset-bottom)}
  .botnav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink3);font-size:10px;font-weight:600;padding:5px 8px;border-radius:9px}
  .botnav a.active{color:var(--accent)}
  .hero-bal{font-size:34px}
}
.feat-matrix{width:100%;border-collapse:collapse;font-size:14px}
.feat-matrix th,.feat-matrix td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
.feat-matrix td.c{text-align:center}
.planbox{border:1px solid var(--line2);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:9px}
.planbox.feat{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.price{font-size:28px;font-weight:750}
.overflow{overflow-x:auto}
</style>
</head>
<body>
<div id="app">
  <!-- onboarding / unlock overlay (shown until unlocked) -->
  <div id="overlay" class="overlay"></div>

  <!-- authenticated shell (hidden until unlocked) -->
  <div id="authed" class="hide">
    <header class="topbar"><div class="inner">
      <div class="brand"><span class="logo">B</span><span>Wallet</span></div>
      <button id="acctsel" class="selbtn" title="Account & network"><span id="acctsel-label">—</span> <svg class="ic-svg dim" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9.5l6 6 6-6"/></svg></button>
      <div style="flex:1"></div>
      <span id="tierbadge" class="chip">free</span>
      <button id="btn-theme" class="btn sm ghost" title="Theme" aria-label="Toggle theme"><svg class="ic-svg" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.2"/><path d="M12 3.8v16.4a8.2 8.2 0 0 0 0-16.4z" fill="currentColor" stroke="none"/></svg></button>
      <button id="btn-lock" class="btn sm ghost" title="Lock wallet" aria-label="Lock wallet"><svg class="ic-svg" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2.2"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/><circle cx="12" cy="15.5" r="1.1"/></svg></button>
    </div></header>

    <div class="shell">
      <nav class="sidenav" id="sidenav"></nav>
      <main class="main"><div id="view" class="view"></div></main>
    </div>

    <nav class="botnav" id="botnav"></nav>
  </div>
</div>

<div id="scrim" class="scrim"><div id="sheet" class="sheet"></div></div>
<div id="toasts"></div>
