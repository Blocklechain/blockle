<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="USDB — Blockle USD">
  <defs>
    <linearGradient id="ub-coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3be6b0"/>
      <stop offset="0.55" stop-color="#1fb886"/>
      <stop offset="1" stop-color="#0e7d5c"/>
    </linearGradient>
    <linearGradient id="ub-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b6dff"/>
      <stop offset="1" stop-color="#37e0c8"/>
    </linearGradient>
    <radialGradient id="ub-shine" cx="0.35" cy="0.28" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- coin -->
  <circle cx="64" cy="64" r="60" fill="url(#ub-coin)" stroke="#0a5c43" stroke-width="3"/>
  <!-- accent ring (blockle brand) -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="url(#ub-ring)" stroke-width="3" opacity="0.9"/>
  <circle cx="64" cy="64" r="45" fill="none" stroke="#eafff7" stroke-width="1.5" opacity="0.35"/>
  <!-- dollar sign -->
  <text x="64" y="86" text-anchor="middle" font-family="ui-sans-serif,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="74" font-weight="800" fill="#eafff7">$</text>
  <!-- USDB wordmark -->
  <text x="64" y="112" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace"
        font-size="13" font-weight="700" letter-spacing="2" fill="#eafff7" opacity="0.92">USDB</text>
  <!-- top shine -->
  <circle cx="64" cy="64" r="60" fill="url(#ub-shine)"/>
</svg>
