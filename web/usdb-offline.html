<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USDB — temporarily unavailable</title>
<link rel="icon" type="image/svg+xml" href="/usdb-token.svg">
<style>
  :root{--bg:#0B0B14;--surface:#141427;--line:#2A2A45;--text:#ECECF5;--muted:#9A9AB5;--green:#34e39e;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  @media (prefers-color-scheme: light){:root{--bg:#f4f6f8;--surface:#fff;--line:#e2e6ec;--text:#0e1420;--muted:#5a6475}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6}
  .card{max-width:460px;margin:24px;padding:36px 30px;background:var(--surface);border:1px solid var(--line);border-radius:18px;text-align:center}
  img{width:72px;height:72px;opacity:.9;filter:grayscale(.3)}
  h1{font-size:26px;letter-spacing:-.02em;margin:18px 0 8px}
  p{color:var(--muted);margin:0 0 10px}
  a{color:var(--green);text-decoration:none;font-weight:600}
</style>
</head>
<body>
  <div class="card">
    <img src="/usdb-token.svg" alt="USDB">
    <h1>USDB is temporarily unavailable</h1>
    <p>Buying and redeeming Blockle USD are paused right now. Please check back later.</p>
    <p style="margin-top:18px"><a href="/">← Back to blockle.org</a></p>
  </div>
</body>
</html>
