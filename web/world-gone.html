<h1>WORLD has been shut down</h1>
<p>WORLD, the experimental browser game that ran on the Blockle chain, has been
discontinued and will not be continued. There was never a WORLD token, and none
was or is planned.</p>
<p>The Blockle chain, wallet, and explorer remain available at
<a href="https://blockle.org">blockle.org</a>.</p>
