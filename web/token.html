<style>
  :root{
    --bg:#0B0B14;--surface:#15152A;--surface2:#1C1C34;--line:#2A2A45;--text:#ECECF5;
    --muted:#9A9AB5;--accent:#8B6DFF;--teal:#37E0C8;--good:#4ADE80;--warn:#F2B04A;--bad:#FB7185;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.55}
  a{color:var(--accent);text-decoration:none}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px}
  header.top{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(11,11,20,.86);backdrop-filter:blur(10px);z-index:10}
  header.top .wrap{display:flex;align-items:center;gap:14px;height:58px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700}
  .cube{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--teal))}
  header.top nav{margin-left:auto;display:flex;gap:18px;font-size:14px}
  header.top nav a{color:var(--muted)} header.top nav a:hover{color:var(--text)}
  .grid{display:grid;grid-template-columns:1.4fr .9fr;gap:18px;margin:22px 0 50px;align-items:start}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
  .hero{display:flex;align-items:center;gap:16px}
  .logo{width:64px;height:64px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent);font-size:24px;overflow:hidden;flex:none}
  .logo img{width:100%;height:100%;object-fit:cover}
  .hname{font-size:22px;font-weight:800}
  .hsym{color:var(--muted);font-size:14px}
  .price{display:flex;align-items:baseline;gap:10px;margin-top:4px}
  .price .v{font:800 26px/1 var(--mono);font-variant-numeric:tabular-nums}
  .price .u{color:var(--muted);font-size:13px}
  .chg.pos{color:var(--good)} .chg.neg{color:var(--bad)}
  .badge{display:inline-flex;align-items:center;gap:7px;font:700 13px var(--sans);padding:7px 12px;border-radius:999px;margin-top:10px}
  .badge.locked{background:#132a1f;color:var(--good)} .badge.unlocked{background:#2e2512;color:var(--warn)}
  canvas{width:100%;height:200px;display:block;margin-top:8px}
  .note{color:var(--muted);font-size:12.5px;margin-top:8px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px}
  .stat .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .stat .val{font:700 17px/1.2 var(--mono);font-variant-numeric:tabular-nums;margin-top:4px}
  .caddr{font:11px var(--mono);color:var(--muted);word-break:break-all;margin-top:10px}
  .tabs{display:flex;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
  .tabs button{flex:1;background:none;border:0;color:var(--muted);font:600 14px var(--sans);padding:9px;border-radius:9px;cursor:pointer}
  .tabs button.on{background:var(--accent);color:#fff}
  .fld{font-size:12px;color:var(--muted);margin:6px 0 4px}
  input.t{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;color:var(--text);font:700 18px var(--mono);padding:11px 13px;outline:none}
  .qrow{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;padding:4px 0}
  .qrow b{color:var(--text);font-family:var(--mono)}
  .cta{width:100%;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:13px;font:700 15px var(--sans);cursor:pointer;margin-top:10px}
  .cta:disabled{opacity:.5;cursor:not-allowed}
  .sharebar{display:flex;gap:8px;margin-top:10px}
  .sharebar button{flex:1;background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px;font:600 13px var(--sans);cursor:pointer}
  .terr{color:var(--bad);font-size:13px;margin-top:8px}
  .empty{color:var(--muted);text-align:center;padding:60px 0}
</style>
</head>
