<!doctype html>
<html><head><meta charset="utf-8"><style>
  /* Blockle Wallet — App Store screenshot generator.
     ?s=1..10&dev=iphone|ipad  → iPhone 1179×2556 / iPad 2048×2732 canvases.
     Brand = the app's real theme tokens (Bk.*). */
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#0B0B14; --surface:#17172B; --surface2:#1F1F38; --surface3:#26263F;
    --line:#2A2A45; --text:#ECECF5; --muted:#9A9AB5; --faint:#6C6C86;
    --accent:#7C5CFF; --accent2:#37E0C8; --good:#4ADE80; --bad:#FB7185; --warn:#FBBF24;
  }
  html,body{ overflow:hidden; background:var(--bg); }
  body{ font-family:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif; color:var(--text); position:relative; }
  body.iphone{ width:1179px; height:2556px; }
  body.ipad{ width:2048px; height:2732px; }
  .nebula{ position:absolute; width:2600px; height:2600px; left:50%; top:-900px; transform:translateX(-50%);
    background:radial-gradient(circle, rgba(124,92,255,.30) 0%, rgba(124,92,255,.08) 40%, transparent 66%); }
  .nebula2{ position:absolute; width:1800px; height:1800px; left:-700px; bottom:-900px;
    background:radial-gradient(circle, rgba(55,224,200,.12) 0%, transparent 62%); }
  .stars{ position:absolute; inset:0; }
  .star{ position:absolute; border-radius:50%; background:#ECECF5; }

  /* caption */
  .cap{ position:relative; text-align:center; padding:120px 90px 0; }
  .ipad .cap{ padding:140px 160px 0; }
  .cap h1{ font-size:104px; font-weight:800; letter-spacing:-4px; line-height:1.04; }
  .ipad .cap h1{ font-size:128px; }
  .cap h1 em{ font-style:normal; background:linear-gradient(100deg,var(--accent) 10%,var(--accent2) 95%);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .cap p{ margin-top:34px; font-size:48px; font-weight:500; color:var(--muted); line-height:1.3; }
  .ipad .cap p{ font-size:58px; }

  /* device frame (bleeds off the bottom) */
  .dev{ position:absolute; left:50%; transform:translateX(-50%); bottom:-140px;
    width:960px; height:2010px; border-radius:120px; background:#000;
    border:14px solid #2b2b40; box-shadow:0 80px 160px rgba(0,0,0,.65), 0 0 180px rgba(124,92,255,.18);
    overflow:hidden; }
  .iphone .dev{ top:640px; }
  .ipad .dev{ width:1560px; height:2100px; border-radius:92px; top:760px; bottom:auto; }
  .notch{ position:absolute; left:50%; top:26px; transform:translateX(-50%); width:280px; height:70px;
    border-radius:40px; background:#000; z-index:5; border:1px solid #1a1a2c; }
  .ipad .notch{ display:none; }

  /* ---- the app screen ---- */
  .app{ position:absolute; inset:0; background:var(--bg); padding:130px 44px 40px; overflow:hidden; font-size:30px; }
  .ipad .app{ padding:90px 72px 40px; font-size:34px; }
  .ahdr{ display:flex; align-items:center; gap:20px; margin-bottom:36px; }
  .ahdr .logo{ width:72px; height:72px; border-radius:18px; background:url('logo3d.png') center/cover; }
  .ahdr b{ font-size:40px; letter-spacing:-1px; }
  .ahdr .sp{ margin-left:auto; color:var(--faint); font-size:28px; }
  .bigbal{ margin:10px 0 6px; font-size:84px; font-weight:800; letter-spacing:-3px; }
  .delta{ color:var(--good); font-size:32px; font-weight:600; margin-bottom:34px; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:28px; padding:30px; margin-bottom:24px; }
  .rowi{ display:flex; align-items:center; gap:24px; padding:20px 6px; }
  .coin{ width:64px; height:64px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:24px; color:#fff; }
  .rowi .nm{ font-weight:700; }
  .rowi .sub{ color:var(--faint); font-size:24px; margin-top:2px; }
  .rowi .amt{ margin-left:auto; text-align:right; font-weight:700; }
  .rowi .usd{ color:var(--muted); font-size:24px; font-weight:500; margin-top:2px; }
  .pill{ display:inline-flex; align-items:center; gap:12px; border:2px solid var(--line); background:var(--surface2);
    border-radius:100px; padding:12px 26px; font-size:26px; font-weight:600; color:var(--muted); }
  .pill .d{ width:16px; height:16px; border-radius:50%; background:var(--accent); }
  .pill.on{ color:var(--text); border-color:var(--accent); }
  .btn{ display:block; text-align:center; background:var(--accent); color:#fff; border-radius:22px;
    padding:28px; font-weight:800; font-size:34px; margin-top:28px; }
  .btn.ghost{ background:var(--surface2); border:2px solid var(--line); color:var(--text); }
  .hr{ height:1px; background:var(--line); margin:8px 0; }
  .glabel{ font-size:24px; letter-spacing:2px; color:var(--faint); font-weight:700; margin:26px 0 14px; }
  .spark{ width:100%; height:150px; }
  .tabbar{ position:absolute; left:0; right:0; bottom:0; height:130px; background:rgba(17,17,31,.96);
    border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-around; padding:0 40px; }
  .tab{ width:56px; height:56px; border-radius:16px; background:var(--surface3); }
  .tab.on{ background:var(--accent); box-shadow:0 0 40px rgba(124,92,255,.5); }
  .kv{ display:flex; justify-content:space-between; padding:14px 4px; font-size:28px; }
  .kv b{ font-weight:700; }
  .kv .m{ color:var(--muted); }
  .ok{ color:var(--good); } .err{ color:var(--bad); } .ac{ color:var(--accent2); }
  .chatme{ background:var(--accent); color:#fff; border-radius:28px 28px 6px 28px; padding:24px 30px; margin:16px 0 16px 120px; font-size:29px; }
  .chatai{ background:var(--surface2); border:1px solid var(--line); border-radius:28px 28px 28px 6px; padding:24px 30px; margin:16px 120px 16px 0; font-size:29px; }
  .nftg{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  .nft{ border-radius:24px; overflow:hidden; border:1px solid var(--line); background:var(--surface); }
  .nft .art{ height:300px; }
  .nft .meta{ padding:18px 22px; font-size:26px; font-weight:700; }
  .nft .meta span{ display:block; color:var(--faint); font-size:22px; font-weight:500; margin-top:4px; }
  .gate{ border:2px solid var(--accent); border-radius:28px; padding:30px; background:rgba(124,92,255,.07); }
  .check{ display:flex; gap:18px; align-items:center; padding:12px 0; font-size:28px; }
  .check .ic{ width:40px; height:40px; border-radius:50%; background:var(--good); flex:none;
    display:flex; align-items:center; justify-content:center; color:#06220f; font-weight:900; font-size:26px; }
</style></head>
<body>
  <div class="nebula"></div><div class="nebula2"></div>
  <div class="stars" id="stars"></div>
  <div class="cap"><h1 id="h"></h1><p id="p"></p></div>
  <div class="dev"><div class="notch"></div><div class="app" id="app"></div></div>

<script>
const Q = new URLSearchParams(location.search);
const DEV = Q.get('dev') === 'ipad' ? 'ipad' : 'iphone';
document.body.className = DEV;
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const st = document.getElementById('stars');
for (let i = 0; i < 150; i++) {
  const d = document.createElement('div'); d.className = 'star';
  const sz = 2 + rnd() * 5;
  d.style.cssText = `left:${rnd()*100}%;top:${rnd()*100}%;width:${sz}px;height:${sz}px;opacity:${.1+rnd()*.4}`;
  st.appendChild(d);
}
const coin = (sym, bg) => `<div class="coin" style="background:${bg}">${sym}</div>`;
const row = (sym, bg, nm, sub, amt, usd) =>
  `<div class="rowi">${coin(sym,bg)}<div><div class="nm">${nm}</div><div class="sub">${sub}</div></div>
   <div class="amt">${amt}<div class="usd">${usd}</div></div></div>`;
const spark = (color, pts) =>
  `<svg class="spark" viewBox="0 0 400 110" preserveAspectRatio="none">
     <path d="${pts}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round"/>
     <path d="${pts} L400,110 L0,110 Z" fill="${color}" opacity="0.12"/></svg>`;
const up = 'M0,88 L40,80 L80,84 L120,66 L160,70 L200,52 L240,58 L280,38 L320,44 L360,24 L400,16';
const tabs = (n) => `<div class="tabbar">${[0,1,2,3,4].map(i=>`<div class="tab${i===n?' on':''}"></div>`).join('')}</div>`;
const hdr = (title) => `<div class="ahdr"><div class="logo"></div><b>${title}</b><div class="sp">9:41</div></div>`;

const SCREENS = {
 1:{h:'Every chain.<br><em>One wallet.</em>', p:'20+ networks with live balances, auto-imported tokens, and one portfolio.',
  app: hdr('Portfolio') + `<div class="bigbal">$24,618.40</div><div class="delta">▲ $1,204.11 (5.1%) today</div>
   <div class="card">${spark('#7C5CFF', up)}</div>
   <div class="card">
     ${row('B','linear-gradient(135deg,#7C5CFF,#37E0C8)','BLOCK','Post-quantum L1','12,480','BLOCK')}<div class="hr"></div>
     ${row('Ξ','#627EEA','Ethereum','ETH · ERC-20','2.4162','$8,712.48')}<div class="hr"></div>
     ${row('S','#9945FF','Solana','SOL + SPL','41.08','$5,897.11')}<div class="hr"></div>
     ${row('₿','#F7931A','Bitcoin','BTC','0.0821','$8,772.79')}
   </div>` + tabs(0)},
 2:{h:'AI trading bots<br><em>built in.</em>', p:'DCA, grid, smart-trade and 15+ strategies — trading for you, within your budget.',
  app: hdr('Bots') + `
   <div class="card"><div class="kv"><b>Grid · SOL/USDC</b><span class="ok">● RUNNING</span></div>
     ${spark('#37E0C8', up)}
     <div class="kv"><span class="m">Realized P&amp;L</span><b class="ok">+$241.80</b></div>
     <div class="kv"><span class="m">Budget used</span><b>$500 / $800</b></div></div>
   <div class="card"><div class="kv"><b>DCA · ETH weekly</b><span class="ok">● RUNNING</span></div>
     <div class="kv"><span class="m">Next buy</span><b>in 2 days</b></div>
     <div class="kv"><span class="m">Avg entry</span><b>$3,412</b></div></div>
   <div class="card"><div class="kv"><b>Signal · RSI swing</b><span class="ac">● PAPER</span></div>
     <div class="kv"><span class="m">Win rate (30d)</span><b>64%</b></div></div>` + tabs(2)},
 3:{h:'Backtest. Rank.<br><em>Launch.</em>', p:'Test every strategy on real market data and launch the winner in one tap.',
  app: hdr('Backtests') + `<div class="glabel">30-DAY RESULTS · RANKED</div>
   <div class="card"><div class="kv"><b>1 · Momentum breakout</b><b class="ok">+18.4%</b></div>${spark('#4ADE80', up)}
     <div class="btn">USE THIS STRATEGY</div></div>
   <div class="card"><div class="kv"><b>2 · Wide grid</b><b class="ok">+11.2%</b></div></div>
   <div class="card"><div class="kv"><b>3 · DCA + dips</b><b class="ok">+7.9%</b></div></div>
   <div class="card"><div class="kv"><b>4 · RSI swing</b><b class="ok">+5.3%</b></div></div>` + tabs(2)},
 4:{h:'Nothing moves<br><em>without you.</em>', p:'Every send, swap, and bot trade passes one mandatory review — decoded, screened, approved by you.',
  app: hdr('Review send') + `
   <div class="gate">
     <div class="kv"><span class="m">Send</span><b>0.25 ETH</b></div>
     <div class="kv"><span class="m">To</span><b>0x9858…da94</b></div>
     <div class="kv"><span class="m">Network fee</span><b>$1.84</b></div>
     <div class="hr"></div>
     <div class="check"><div class="ic">✓</div>Address screened — no scam reports</div>
     <div class="check"><div class="ic">✓</div>Transaction decoded &amp; verified</div>
     <div class="check"><div class="ic">✓</div>Within your session limit</div>
     <div class="check"><div class="ic">✓</div>12 security checks ran</div>
   </div>
   <div class="btn">Approve &amp; sign</div>
   <div class="btn ghost">Reject</div>` + tabs(0)},
 5:{h:'Post-quantum<br><em>security.</em>', p:'The BLOCK chain is secured with ML-DSA (FIPS 204) — built to withstand quantum computers.',
  app: hdr('BLOCK') + `
   <div class="card" style="text-align:center;padding:50px 30px">
     <div style="width:180px;height:180px;margin:0 auto 26px;border-radius:44px;background:url('logo3d.png') center/cover;"></div>
     <div style="font-size:44px;font-weight:800">BLOCK</div>
     <div style="color:var(--muted);font-size:28px;margin-top:8px">Post-quantum Layer 1</div>
     <div style="margin-top:26px"><span class="pill on"><span class="d"></span>ML-DSA · FIPS 204</span></div>
   </div>
   <div class="card">
     <div class="check"><div class="ic">✓</div>Keys generated on your device</div>
     <div class="check"><div class="ic">✓</div>Encrypted locally — never uploaded</div>
     <div class="check"><div class="ic">✓</div>Quantum-resistant signatures</div>
   </div>` + tabs(1)},
 6:{h:'Buy crypto<br><em>with your card.</em>', p:'Fiat on- and off-ramps, delivered straight to your own addresses.',
  app: hdr('Buy') + `
   <div class="card" style="text-align:center;padding:46px 30px">
     <div style="color:var(--muted);font-size:30px">You pay</div>
     <div class="bigbal" style="font-size:96px">$100</div>
     <div style="color:var(--muted);font-size:30px;margin:18px 0 6px">You receive</div>
     <div style="font-size:52px;font-weight:800" class="ac">0.0271 ETH</div>
   </div>
   <div class="card"><div class="kv"><span class="m">Delivered to</span><b>Your wallet · 0x9858…da94</b></div>
     <div class="kv"><span class="m">Payment</span><b>Card / bank</b></div></div>
   <div class="btn">Continue</div>` + tabs(1)},
 7:{h:'Swap against<br><em>real liquidity.</em>', p:'One transparent BLOCK price across every currency — bot fees fund the pools.',
  app: hdr('Blockle Liquidity') + `
   <div class="card"><div class="kv"><span class="m">BLOCK price</span><b>$0.00101</b></div>${spark('#7C5CFF', up)}
     <div class="kv"><span class="m">Treasury · on-chain</span><b>49,998 BLOCK</b></div></div>
   <div class="card">
     <div class="glabel" style="margin-top:0">SWAP</div>
     <div class="kv"><b>80 BLOCK</b><span class="m">→</span><b class="ac">0.00092 SOL</b></div>
     <div class="kv"><span class="m">Price impact</span><b class="ok">pushes BLOCK up 0.2%</b></div>
   </div>
   <div class="btn">Swap</div>` + tabs(3)},
 8:{h:'Explore Web3<br><em>safely.</em>', p:'A built-in dApp browser with a curated, security-screened directory.',
  app: hdr('Browser') + `
   <div class="card" style="padding:20px 26px"><div class="kv" style="padding:4px"><span class="m">https://app.uniswap.org</span><b class="ok">SCREENED ✓</b></div></div>
   <div class="glabel">TRUSTED DAPPS</div>
   <div class="card">
     ${row('U','#FF007A','Uniswap','DEX · Ethereum','98','popular')}<div class="hr"></div>
     ${row('J','#19FB9B','Jupiter','DEX · Solana','96','popular')}<div class="hr"></div>
     ${row('A','#B6509E','Aave','Lending · Multi','91','popular')}<div class="hr"></div>
     ${row('S','#00D1FF','STON.fi','DEX · TON','84','popular')}
   </div>` + tabs(4)},
 9:{h:'Your NFTs,<br><em>every chain.</em>', p:'View and send collectibles across networks — including native BLOCK-721.',
  app: hdr('NFTs') + `
   <div class="nftg">
     <div class="nft"><div class="art" style="background:linear-gradient(135deg,#7C5CFF,#37E0C8)"></div><div class="meta">Alien #0421<span>BLOCK-721</span></div></div>
     <div class="nft"><div class="art" style="background:linear-gradient(135deg,#FF007A,#7C5CFF)"></div><div class="meta">Punk Deriv<span>Ethereum</span></div></div>
     <div class="nft"><div class="art" style="background:linear-gradient(135deg,#F7931A,#FBBF24)"></div><div class="meta">Ordinal Cat<span>Solana</span></div></div>
     <div class="nft"><div class="art" style="background:linear-gradient(135deg,#37E0C8,#4ADE80)"></div><div class="meta">Worldling<span>BLOCK-721</span></div></div>
   </div>` + tabs(1)},
 10:{h:'Talk to<br><em>your wallet.</em>', p:'Ask in plain language. The AI suggests — only you can approve.',
  app: hdr('Assistant') + `
   <div class="chatme">How did my bots do this week?</div>
   <div class="chatai">Your 3 bots made <b class="ok">+$312.40</b> this week. The SOL/USDC grid led with +$241.80 across 38 fills.</div>
   <div class="chatme">Move half the profit to BTC</div>
   <div class="chatai">Prepared: swap $156.20 USDC → BTC. <b>Waiting for your approval</b> — review the details to continue.</div>
   <div class="btn">Review &amp; approve</div>` + tabs(2)},
};
const s = SCREENS[Q.get('s') || '1'];
document.getElementById('h').innerHTML = s.h;
document.getElementById('p').innerHTML = s.p;
document.getElementById('app').innerHTML = s.app;
</script>
</body></html>
