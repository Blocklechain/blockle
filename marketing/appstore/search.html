<!doctype html>
<html><head><meta charset="utf-8"><style>
  /* Blockle Wallet — App Store SEARCH-results key art (5244×2950).
     Centered, bigger elements: must stay legible scaled far down. */
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:5244px; height:2950px; overflow:hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    background:#0B0B14; color:#ECECF5; position:relative;
  }
  .nebula { position:absolute; width:5200px; height:5200px; left:50%; top:46%; transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(124,92,255,.34) 0%, rgba(124,92,255,.10) 36%, transparent 64%); }
  .nebula2 { position:absolute; width:2600px; height:2600px; right:-800px; bottom:-1300px;
    background:radial-gradient(circle, rgba(55,224,200,.14) 0%, transparent 64%); }
  .grid { position:absolute; inset:0; opacity:.13;
    background-image:linear-gradient(rgba(124,92,255,.25) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(124,92,255,.25) 1px, transparent 1px);
    background-size:164px 164px;
    -webkit-mask-image:radial-gradient(ellipse 62% 58% at 50% 46%, #000 0%, transparent 74%); }
  .stars { position:absolute; inset:0; }
  .star { position:absolute; border-radius:50%; background:#ECECF5; }

  .stack { position:absolute; left:50%; top:47%; transform:translate(-50%,-50%);
    display:flex; align-items:center; gap:220px; }
  .heroWrap { position:relative; width:1780px; height:1780px; flex:none; }
  .glow { position:absolute; inset:-260px;
    background:radial-gradient(circle, rgba(124,92,255,.46) 0%, rgba(124,92,255,.14) 44%, transparent 70%); }
  .hero { position:absolute; inset:0; background:url('logo3d.png') center/contain no-repeat;
    filter:drop-shadow(0 80px 140px rgba(0,0,0,.6)); }
  .ring { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:2080px; height:2080px; border:3px solid rgba(124,92,255,.26); border-radius:50%; }

  .copy { display:flex; flex-direction:column; }
  .word { font-weight:800; font-size:470px; letter-spacing:-16px; line-height:.95; color:#ECECF5; }
  .word .accent { background:linear-gradient(100deg,#7C5CFF 10%,#37E0C8 95%);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .tag { margin-top:96px; font-weight:600; font-size:132px; letter-spacing:-2px; color:#9A9AB5; line-height:1.3; white-space:nowrap; }
  .tag b { color:#ECECF5; font-weight:700; }
  .badges { margin-top:120px; display:flex; gap:48px; }
  .chip { display:flex; align-items:center; gap:26px; padding:36px 60px; border-radius:200px;
    border:3px solid #2A2A45; background:rgba(23,23,43,.74); font-size:88px; font-weight:600; white-space:nowrap; }
  .dot { width:34px; height:34px; border-radius:50%; background:#7C5CFF; }
  .chip:nth-child(2) .dot { background:#37E0C8; }
  .chip:nth-child(3) .dot { background:#4ADE80; }
</style></head>
<body>
  <div class="nebula"></div><div class="nebula2"></div>
  <div class="grid"></div>
  <div class="stars" id="stars"></div>

  <div class="stack">
    <div class="heroWrap">
      <div class="ring"></div>
      <div class="glow"></div>
      <div class="hero"></div>
    </div>
    <div class="copy">
      <div class="word">BLOCKLE<br><span class="accent">WALLET</span></div>
      <div class="tag"><b>Post-quantum</b> multi-chain wallet<br>with AI trading bots built in</div>
      <div class="badges">
        <div class="chip"><span class="dot"></span>20+ chains</div>
        <div class="chip"><span class="dot"></span>Non-custodial</div>
        <div class="chip"><span class="dot"></span>Trading bots</div>
      </div>
    </div>
  </div>

  <script>
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const s = document.getElementById('stars');
    for (let i = 0; i < 240; i++) {
      const d = document.createElement('div'); d.className = 'star';
      const sz = 2 + rnd() * 7;
      d.style.cssText = `left:${rnd()*5244}px;top:${rnd()*2950}px;width:${sz}px;height:${sz}px;opacity:${.12+rnd()*.5}`;
      s.appendChild(d);
    }
  </script>
</body></html>
