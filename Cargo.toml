[package]
name = "blockle"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Blockle AutoPool — the universal deployment system for PoW mining pools: point it at a chain, get a pool"

[[bin]]
name = "blockle"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
sha2 = "0.10"

[profile.release]
lto = "thin"
