[package]
name = "blockle"
version = "0.2.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Blockle AutoPool — the universal deployment system for PoW mining pools: point it at a chain, get a pool"
repository = "https://github.com/blocklechain/blockle"
homepage = "https://blockle.org"
readme = "README.md"
keywords = ["mining", "pool", "stratum", "proof-of-work", "blockchain"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]
exclude = ["chain/", "python/", ".github/", "tests/"]

[[bin]]
name = "blockle"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
sha2 = "0.10"
scrypt = { version = "0.11", default-features = false }
rs-x11-hash = "0.1"

[profile.release]
lto = "thin"
