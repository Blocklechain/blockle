name: Blockle Protect iOS TestFlight

# Native SwiftUI app. Project is generated from ios/project.yml via XcodeGen,
# cloud-signed with the App Store Connect API key (secrets ASC_KEY_*), bundle
# org.blockle.protect, team B87ALX4XW9. First run creates the ASC app record
# (fastlane produce); if the key lacks App Manager, create "Blockle Protect" in
# App Store Connect once and re-run.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'blockle-protect/ios/**'
      - '.github/workflows/blockle-protect-ios.yml'

concurrency:
  group: blockle-protect-ios
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "$XC" ] && sudo xcode-select -s "$XC/Contents/Developer" || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install App Store Connect API key
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Ensure App Store Connect app record (best-effort)
        continue-on-error: true
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          # fastlane produce must be given the ASC API key explicitly via a JSON
          # file — without it, produce falls back to username/password auth and
          # dies with "No value found for 'username'", so the app record never
          # gets created and the TestFlight upload then can't find an Apple ID.
          KEY_PEM="$(echo "$ASC_KEY_BASE64" | base64 --decode)"
          jq -n --arg kid "$KID" --arg iss "$ISS" --arg key "$KEY_PEM" \
            '{key_id:$kid, issuer_id:$iss, key:$key, duration:1200, in_house:false}' > asc_api_key.json
          gem install fastlane -N || true
          fastlane produce create \
            --api_key_path asc_api_key.json \
            --app_identifier org.blockle.protect \
            --app_name "Blockle Protect" \
            --sku blockleprotect0001 \
            --language "English (U.S.)" \
            --team_id B87ALX4XW9 \
            --skip_devcenter true || echo "produce non-fatal — app record may already exist, or the name is taken / key lacks App Manager."
          rm -f asc_api_key.json

      - name: Generate Xcode project
        working-directory: blockle-protect/ios
        run: xcodegen generate

      - name: Archive + export IPA (cloud-signed)
        working-directory: blockle-protect/ios
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          BN: ${{ github.run_number }}
        run: |
          set -eo pipefail
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_${KID}.p8"
          # archive UNSIGNED — avoids automatic signing picking an iOS *development*
          # profile (a fresh team has no registered devices, so that lookup fails).
          # Distribution signing happens at export, where the ASC API key creates the
          # device-less App Store cert + profile on demand.
          xcodebuild -project BlockleProtect.xcodeproj -scheme BlockleProtect -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive \
            CURRENT_PROJECT_VERSION="$BN" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS"
          ls -lh build/ipa/*.ipa

      - name: Upload to TestFlight
        working-directory: blockle-protect/ios
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eo pipefail
          IPA="$(ls build/ipa/*.ipa | head -1)"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$KID" --apiIssuer "$ISS" --verbose

      - name: Upload IPA artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockle-protect-ipa
          path: blockle-protect/ios/build/ipa/*.ipa
          if-no-files-found: ignore
