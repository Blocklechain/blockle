name: Blockle Protect iOS TestFlight

# Native SwiftUI app. Project is generated from ios/project.yml via XcodeGen,
# cloud-signed with the App Store Connect API key (secrets ASC_KEY_*), bundle
# org.blockle.protect, team B87ALX4XW9. First run creates the ASC app record
# (fastlane produce); if the key lacks App Manager, create "Blockle Protect" in
# App Store Connect once and re-run.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'blockle-protect/ios/**'
      - '.github/workflows/blockle-protect-ios.yml'

concurrency:
  group: blockle-protect-ios
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "$XC" ] && sudo xcode-select -s "$XC/Contents/Developer" || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install App Store Connect API key
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Preflight — App Store Connect app record must exist
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          # The App Store Connect API cannot CREATE an app record — that is a
          # one-time manual step in App Store Connect (App Store Connect → Apps →
          # + → New App: Platform iOS, Bundle ID org.blockle.protect, name
          # "Blockle Protect", SKU blockleprotect0001). Everything else
          # (signing, upload, TestFlight) is automated. This step just checks the
          # record exists and fails early with a clear message if it doesn't,
          # instead of a cryptic altool "Cannot determine the Apple ID" later.
          KEY_PEM="$(echo "$ASC_KEY_BASE64" | base64 --decode)"
          NOW=$(date +%s); EXP=$((NOW + 600))
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          HEADER=$(printf '{"alg":"ES256","kid":"%s","typ":"JWT"}' "$KID" | b64url)
          PAYLOAD=$(printf '{"iss":"%s","iat":%s,"exp":%s,"aud":"appstoreconnect-v1"}' "$ISS" "$NOW" "$EXP" | b64url)
          SIG=$(printf '%s.%s' "$HEADER" "$PAYLOAD" | openssl dgst -sha256 -sign <(printf '%s' "$KEY_PEM") | b64url)
          JWT="$HEADER.$PAYLOAD.$SIG"
          COUNT=$(curl -s "https://api.appstoreconnect.apple.com/v1/apps?filter%5BbundleId%5D=org.blockle.protect" \
            -H "Authorization: Bearer $JWT" | jq '.data | length')
          echo "App records for org.blockle.protect: ${COUNT:-unknown}"
          if [ "${COUNT:-0}" = "0" ]; then
            echo "::error::No App Store Connect app record for org.blockle.protect. Create it once in App Store Connect (Apps → + → New App), then re-run this workflow. The signed IPA is still produced and uploaded as a build artifact."
            # don't hard-fail the build — let archive + artifact upload still run
            echo "MISSING_APP_RECORD=1" >> "$GITHUB_ENV"
          fi

      - name: Generate Xcode project
        working-directory: blockle-protect/ios
        run: xcodegen generate

      - name: Cross-platform crypto tests (iOS 26 simulator)
        working-directory: blockle-protect/ios
        run: |
          set -eo pipefail
          # Pick an available iPhone simulator (name varies by Xcode release).
          SIM="$(xcrun simctl list devices available | grep -oE 'iPhone [0-9][0-9A-Za-z ]*\(' | sed 's/ ($//' | head -1 | xargs)"
          [ -z "$SIM" ] && SIM="iPhone 16"
          echo "Testing on simulator: $SIM"
          xcodebuild test -project BlockleProtect.xcodeproj -scheme BlockleProtect \
            -destination "platform=iOS Simulator,name=$SIM,OS=latest" \
            CODE_SIGNING_ALLOWED=NO | tail -80

      - name: Archive + export IPA (cloud-signed)
        working-directory: blockle-protect/ios
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          BN: ${{ github.run_number }}
        run: |
          set -eo pipefail
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_${KID}.p8"
          # archive UNSIGNED — avoids automatic signing picking an iOS *development*
          # profile (a fresh team has no registered devices, so that lookup fails).
          # Distribution signing happens at export, where the ASC API key creates the
          # device-less App Store cert + profile on demand.
          xcodebuild -project BlockleProtect.xcodeproj -scheme BlockleProtect -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive \
            CURRENT_PROJECT_VERSION="$BN" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS"
          ls -lh build/ipa/*.ipa

      - name: Upload to TestFlight
        working-directory: blockle-protect/ios
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eo pipefail
          if [ "${MISSING_APP_RECORD:-0}" = "1" ]; then
            echo "Skipping TestFlight upload — create the App Store Connect app record first (see the preflight step). The signed IPA is attached as a build artifact."
            exit 0
          fi
          IPA="$(ls build/ipa/*.ipa | head -1)"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$KID" --apiIssuer "$ISS" --verbose

      - name: Upload IPA artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockle-protect-ipa
          path: blockle-protect/ios/build/ipa/*.ipa
          if-no-files-found: ignore
