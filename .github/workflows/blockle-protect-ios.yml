name: Blockle Protect iOS TestFlight

# Native SwiftUI app. Project is generated from ios/project.yml via XcodeGen,
# cloud-signed with the App Store Connect API key (secrets ASC_KEY_*), bundle
# org.blockle.protect, team B87ALX4XW9. First run creates the ASC app record
# (fastlane produce); if the key lacks App Manager, create "Blockle Protect" in
# App Store Connect once and re-run.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'blockle-protect/ios/**'
      - '.github/workflows/blockle-protect-ios.yml'

concurrency:
  group: blockle-protect-ios
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (26 or later)
        run: |
          set -eo pipefail
          # Pick the NEWEST installed Xcode whose major version is >= 26.
          #
          # This used to glob Xcode_26*.app, which pinned the build to 26 even on
          # a runner that had something newer. Apple's ITMS-90725 says uploads
          # built with older than the iOS 27 SDK are rejected from April 2027, so
          # a hard pin would have quietly kept shipping 26 right up to the day
          # uploads started failing. 26 is the FLOOR (the PQ crypto needs iOS 26
          # CryptoKit for ML-KEM/ML-DSA), never the target.
          XC=""
          for cand in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V -r); do
            ver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
                   "$cand/Contents/version.plist" 2>/dev/null || true)"
            [ -z "$ver" ] && continue
            if [ "${ver%%.*}" -ge 26 ] 2>/dev/null; then
              XC="$cand"; echo "selected Xcode $ver -> $cand"; break
            fi
          done
          # Fail loudly rather than the old `|| true`, which fell back to the
          # runner default and produced a confusing failure much later.
          if [ -z "$XC" ]; then
            echo "::error::No Xcode 26 or newer on this runner."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install App Store Connect API key
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Fetch Safari blocklists into content-blocker extensions
        working-directory: blockle-protect/ios
        run: |
          set -eo pipefail
          curl -fsSL https://protect.blockle.org/blocklists/core.json   -o Blockers/Core/blockerList.json
          curl -fsSL https://protect.blockle.org/blocklists/adult1.json -o Blockers/Adult1/blockerList.json
          curl -fsSL https://protect.blockle.org/blocklists/adult2.json -o Blockers/Adult2/blockerList.json
          curl -fsSL https://protect.blockle.org/blocklists/adult3.json -o Blockers/Adult3/blockerList.json
          curl -fsSL https://protect.blockle.org/blocklists/adult4.json -o Blockers/Adult4/blockerList.json
          ls -lh Blockers/*/blockerList.json
          # sanity: each must be a non-empty JSON array
          for f in Core Adult1 Adult2 Adult3 Adult4; do
            python3 -c "import json,sys; d=json.load(open('Blockers/$f/blockerList.json')); assert isinstance(d,list) and len(d)>0; print('$f:', len(d), 'rules')"
          done

      - name: Generate Xcode project
        working-directory: blockle-protect/ios
        run: xcodegen generate

      - name: Cross-platform crypto tests (iOS 26 simulator)
        working-directory: blockle-protect/ios
        run: |
          set -eo pipefail
          # Pick an available iPhone simulator (name varies by Xcode release).
          SIM="$(xcrun simctl list devices available | grep -oE 'iPhone [0-9][0-9A-Za-z ]*\(' | sed 's/ ($//' | head -1 | xargs)"
          [ -z "$SIM" ] && SIM="iPhone 16"
          echo "Testing on simulator: $SIM"
          xcodebuild test -project BlockleProtect.xcodeproj -scheme BlockleProtect \
            -destination "platform=iOS Simulator,name=$SIM,OS=latest" \
            CODE_SIGNING_ALLOWED=NO | tail -80

      - name: Ensure App Store profiles exist (ASC API)
        working-directory: blockle-protect/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eo pipefail
          # ASK THE API INSTEAD OF HOPING -allowProvisioningUpdates WILL.
          #
          # Export fails with "Authentication failed" + "No profiles ... were
          # found" while the log underneath says `status code: 200` and
          # `"errors": []`. The key authenticates; the PROFILE LIST comes back
          # empty, and Xcode reports empty as an auth failure.
          #
          # asc_profiles.py lists what the key can see, creates any missing
          # IOS_APP_STORE profile, and installs the .mobileprovision where
          # xcodebuild looks. All three outcomes are progress — including a 403,
          # which finally answers whether this key has the Admin / App Manager
          # role rather than leaving it to inference.
          # A VENV, because the runner's Python is PEP 668 "externally
          # managed" and refuses a system-wide install outright:
          #   error: externally-managed-environment   (run 45130798305)
          # --break-system-packages would also work and is exactly the kind of
          # flag that breaks a different runner image later.
          python3 -m venv .ascvenv
          ./.ascvenv/bin/pip install --quiet --disable-pip-version-check \
            'pyjwt[crypto]'
          ./.ascvenv/bin/python asc_profiles.py --out profiles.json
          echo "--- profiles.json ---"
          cat profiles.json

      - name: Archive + export IPA (cloud-signed)
        working-directory: blockle-protect/ios
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          BN: ${{ github.run_number }}
        run: |
          set -eo pipefail
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_${KID}.p8"
          # ARCHIVE SIGNED FOR DISTRIBUTION. The entitlements can only enter the
          # build here.
          #
          # Xcode processes CODE_SIGN_ENTITLEMENTS only when it signs. The
          # archive used to be built with CODE_SIGNING_ALLOWED=NO, so it carried
          # no entitlements, and `-exportArchive` — which can only preserve what
          # it finds — re-signed it with four generic keys. Nothing from
          # BlockleProtect.entitlements survived: no App Group (My List could not
          # read its own rules) and no iCloud container (backup "unavailable").
          # That was true of every signed build this project has ever produced.
          #
          # Signing the archive was tried once and failed with "Your team has no
          # devices from which to generate a provisioning profile" (run
          # 45113805102), which was read at the time as archives requiring a
          # development profile. They do not. The archive command simply was not
          # given `-allowProvisioningUpdates` or the ASC key, so Xcode could not
          # ask Apple for anything and fell back to searching for local
          # DEVELOPMENT profiles — and those are what need registered devices.
          #
          # SIGNED AD HOC, which is the only identity available at archive time.
          # Four approaches were tried in front of this one; each is closed by
          # something that cannot be worked around from here:
          #
          #   unsigned                 Xcode skips CODE_SIGN_ENTITLEMENTS
          #                            entirely. This was the original bug.
          #   automatic                resolves `archive` to a DEVELOPMENT
          #                            profile, and Apple will not issue one to
          #                            a team with no registered devices
          #                            (run 45113805102).
          #   automatic + forced
          #     distribution identity  "has conflicting provisioning settings …
          #                            automatically signed for development, but
          #                            a conflicting code signing identity Apple
          #                            Distribution has been manually specified"
          #                            — with automatic signing Xcode picks the
          #                            identity and rejects an override
          #                            (run 45118597006, all seven targets).
          #   manual distribution      needs the certificate AND private key in
          #                            the keychain; cloud signing keeps them in
          #                            its own, so the runner reports "0 valid
          #                            identities found" (run 45117853957).
          #
          #   ad-hoc via build settings  CODE_SIGN_STYLE=Manual archives fine and
          #                            DOES embed the entitlements, but the style
          #                            is recorded in the archive and export then
          #                            tries to sign manually too, losing the
          #                            cloud provisioning that had been working:
          #                            "No profiles for 'org.blockle.protect'
          #                            were found" (run 45119756967).
          #
          # So the archive stays unsigned and is ad-hoc signed AFTERWARDS, below.
          # Ad-hoc is the one identity that needs no certificate, no private key
          # and no provisioning profile, and `codesign -s -` applies it without
          # touching any build setting — so the project's signing style stays
          # Automatic and export keeps behaving exactly as it already does.
          xcodebuild -project BlockleProtect.xcodeproj -scheme BlockleProtect -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive \
            CURRENT_PROJECT_VERSION="$BN" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

          # ---- PUT THE ENTITLEMENTS INTO THE ARCHIVE ------------------------
          # NESTED CODE FIRST, OUTER BUNDLE LAST: signing the .app re-seals it
          # over its PlugIns, so an extension signed afterwards breaks the seal.
          ARCH_APP="build/App.xcarchive/Products/Applications/BlockleProtect.app"
          EXT="$ARCH_APP/PlugIns/ShieldCustom.appex"
          if [ -e "$EXT" ]; then
            codesign -f -s - --entitlements ShieldCustom.entitlements "$EXT"
          fi
          codesign -f -s - --entitlements BlockleProtect.entitlements "$ARCH_APP"

          # FAIL HERE, NOT AFTER UPLOAD. Export cannot add an entitlement the
          # archive does not have, so if the App Group is missing at this point
          # every later step is building a broken binary. Checking the archive
          # separates "the entitlements never got in" from "export dropped them".
          GROUP="group.org.blockle.protect"
          for t in "$ARCH_APP" "$EXT"; do
            [ -e "$t" ] || { echo "::error::not in the archive: $t"; exit 1; }
            if codesign -d --entitlements :- "$t" 2>/dev/null | grep -q "$GROUP"; then
              echo "archive OK: $(basename "$t") carries $GROUP"
            else
              echo "::error::the ARCHIVE lost its entitlements — export cannot restore them."
              echo "  $(basename "$t") does not claim $GROUP."
              codesign -d --entitlements :- "$t" 2>&1 | head -30 || true
              exit 1
            fi
          done

          # WHEN EXPORT FAILS, READ WHAT XCODE WROTE DOWN.
          #
          # `exportArchive` prints two lines — "Authentication failed" and "No
          # profiles for 'org.blockle.protect' were found" — and neither says
          # which capability it could not provision. It also writes a full log
          # bundle and tells you the path, which every run so far has discarded.
          #
          # This matters because the obvious reading of those two lines is wrong:
          # the ASC key is NOT broken. It has uploaded builds successfully on
          # every run up to 44927460372. What changed is that the app now ASKS
          # for the App Group and the iCloud container, so export has to find a
          # profile that grants them instead of one that grants nothing.
          #
          # WHAT THE LOG SHOWED (run 45121886490), and it is not authentication:
          #
          #     status code: 200 (no error)
          #             "errors" : [ ],
          #
          # Apple answered HTTP 200 with an empty error list. The key
          # authenticated. The PROFILE QUERY CAME BACK EMPTY, and Xcode reports
          # an empty result as "Authentication failed" — which sent this
          # investigation after the credentials for three runs.
          #
          # So what is missing is an App Store distribution profile that grants
          # the App Group across all seven bundle ids (and iCloud on the main
          # app), and `-allowProvisioningUpdates` is not creating one. Two ways
          # forward, neither of them a code change here:
          #
          #   * create the profiles in the Developer portal with App Groups
          #     enabled, then switch ExportOptions.plist to manual signing and
          #     name them per bundle id; or
          #   * confirm the ASC key's role is Admin or App Manager — a key that
          #     can upload builds cannot necessarily CREATE profiles, and the
          #     empty 200 is consistent with exactly that.
          #
          # Until one of those happens this step fails here, deliberately, which
          # means no new TestFlight build. That is the intended trade: the builds
          # it replaced all shipped with My List unable to read its own rules.
          # EXPORT OPTIONS ARE GENERATED, not checked in: the profile names
          # come from the step above, and a plist naming profiles that were
          # never installed fails later and less clearly than automatic
          # signing does.
          python3 gen_export_options.py profiles.json \
            ExportOptions.generated.plist
          cat ExportOptions.generated.plist

          if ! xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.generated.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" \
            2>&1 | tee build/export.log; then
            echo "::group::what Xcode actually tried (xcdistributionlogs)"
            for d in $(ls -dt "${TMPDIR:-/tmp}"/BlockleProtect_*.xcdistributionlogs \
                              /var/folders/*/*/T/BlockleProtect_*.xcdistributionlogs \
                              2>/dev/null | head -2); do
              echo "=== $d"
              for f in "$d"/*; do
                echo "--- $(basename "$f")"
                tail -150 "$f" 2>/dev/null || true
              done
            done
            echo "::endgroup::"
            echo "::error::export failed — see the xcdistributionlogs group above."
            exit 1
          fi
          ls -lh build/ipa/*.ipa

      - name: Verify the App Group reached BOTH signed binaries
        working-directory: blockle-protect/ios
        run: |
          set -eo pipefail
          # "MY LIST" IS THE ONE BLOCKER THAT READS ITS RULES AT RUNTIME.
          #
          # Every other Safari blocker ships a static list inside its own bundle.
          # My List does not: the app writes custom-blockerList.json into the
          # shared App Group container and the ShieldCustom extension reads it
          # back (CustomBlockStore.swift, CustomBlockerRequestHandler.swift). So
          # the entitlement has to be on TWO code signatures, and if it is on
          # the app alone the app writes a file the extension cannot see.
          #
          # That failure is SILENT. Safari just does not block the user's sites,
          # there is no error anywhere, and the only way to find out is to add a
          # site and watch it load. It has already cost one round of debugging.
          #
          # Entitlements are baked in at SIGNING time, so enabling the capability
          # in the Developer portal changes nothing about a build that already
          # exists — it takes effect on the next export, which is this one, via
          # -allowProvisioningUpdates above. This step is what proves it landed.
          GROUP="group.org.blockle.protect"
          IPA="$(ls build/ipa/*.ipa | head -1)"
          # WHAT APPLE ACTUALLY ISSUED. The embedded profile is the authority on
          # what this app is ALLOWED to claim; the entitlements are what it does
          # claim. Printing both turns "the App Group is missing" into a
          # decidable question instead of a guess about whose fault it is.
          dump_profile() {
            local prov="$1/embedded.mobileprovision"
            [ -e "$prov" ] || { echo "   (no embedded.mobileprovision)"; return; }
            security cms -D -i "$prov" 2>/dev/null \
              | plutil -extract Entitlements xml1 -o - - 2>/dev/null \
              | grep -E "application-groups|icloud|<string>|<key>" | head -24
          }
          rm -rf build/verify && mkdir -p build/verify
          unzip -q "$IPA" -d build/verify
          APP="$(ls -d build/verify/Payload/*.app | head -1)"
          EXT="$APP/PlugIns/ShieldCustom.appex"
          fail=0
          for target in "$APP" "$EXT"; do
            if [ ! -e "$target" ]; then
              echo "::error::missing from the IPA: $target"; fail=1; continue
            fi
            echo "--- $(basename "$target"): profile allows:"
            dump_profile "$target"
            ents="$(codesign -d --entitlements :- "$target" 2>/dev/null || true)"
            if printf '%s' "$ents" | grep -q "$GROUP"; then
              echo "OK   $(basename "$target") carries $GROUP"
            else
              echo "::error::$(basename "$target") is MISSING the $GROUP App Group."
              echo "  Enable App Groups on this App ID in the Developer portal"
              echo "  (Identifiers -> the bundle id -> App Groups -> Configure)"
              echo "  and re-run. My List cannot work without it on BOTH."
              printf '%s\n' "$ents" | sed -n '1,40p'
              fail=1
            fi
          done
          # The static blockers deliberately have NO App Group — a shared
          # container they never read is capability surface for nothing.
          for s in ShieldCore ShieldAdult1 ShieldAdult2 ShieldAdult3 ShieldAdult4; do
            a="$APP/PlugIns/$s.appex"
            [ -e "$a" ] || continue
            if codesign -d --entitlements :- "$a" 2>/dev/null | grep -q "$GROUP"; then
              echo "::warning::$s carries the App Group but does not need it"
            fi
          done
          exit $fail

      - name: Upload to TestFlight
        working-directory: blockle-protect/ios
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eo pipefail
          # altool authenticates with the ASC API key itself; it is the authoritative
          # check that the app record exists. If it does not, altool fails with a
          # clear "Cannot determine the Apple ID from Bundle ID" — create the app
          # once in App Store Connect (Apps → + → New App, Bundle ID
          # org.blockle.protect) and re-run. The signed IPA is kept as an artifact.
          IPA="$(ls build/ipa/*.ipa | head -1)"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$KID" --apiIssuer "$ISS" --verbose

      - name: Upload IPA artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockle-protect-ipa
          path: blockle-protect/ios/build/ipa/*.ipa
          if-no-files-found: ignore
