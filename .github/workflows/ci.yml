name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "If set, zip each platform GUI (macOS = .app only) and upload it to this release tag."
        required: false
        default: ""

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gui-artifact: BlockleWallet-linux-x86_64
            bin-artifact: blockle-binaries-linux-x86_64
          - os: macos-latest
            gui-artifact: BlockleWallet-macos-arm64
            bin-artifact: blockle-binaries-macos-arm64
          - os: windows-latest
            gui-artifact: BlockleWallet-windows-x86_64
            bin-artifact: blockle-binaries-windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            chain

      - name: POSIX header shim for rs-x11-hash (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p .win-posix-shim
          touch .win-posix-shim/unistd.h
          echo "CFLAGS=-I$(cygpath -w "$PWD/.win-posix-shim")" >> $GITHUB_ENV

      - name: Build pool workspace
        run: cargo build --release

      - name: Build BLOCK chain workspace
        run: cargo build --release --manifest-path chain/Cargo.toml

      - name: Rust tests (pool)
        run: cargo test --release

      - name: Rust tests (chain)
        run: cargo test --release --manifest-path chain/Cargo.toml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Install Python package + Qt
        # [multichain] pulls coincurve/pynacl/pycryptodome/cryptography/base58
        # so the new multi-chain modules (imported by qtmultichain) load in CI.
        run: pip install "./python[multichain]" "PySide6>=6.6" pyinstaller pytest

      - name: Python integration tests (headless Qt)
        # Windows is informational for now: the suite drives real sockets and
        # subprocesses and is tuned on unix; the GUI build below still gates.
        continue-on-error: ${{ runner.os == 'Windows' }}
        timeout-minutes: 25
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          EXE=""; [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          export BLOCKLE_BIN="$PWD/target/release/blockle$EXE"
          export BLOCKLE_BIZ_BIN="$PWD/target/release/blockle-biz$EXE"
          export BLOCKLE_CHAIN_BIN="$PWD/chain/target/release/blockle-chain$EXE"
          # pytest runs both the unittest.TestCase integration tests and the
          # new pytest-style multichain/agent suites (unittest discover can't
          # import the latter -> ModuleNotFoundError: pytest).
          cd python && python -m pytest tests -v

      - name: Package Qt wallet GUI (PyInstaller)
        shell: bash
        run: |
          EXE=""; SEP=":"
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=".exe"; SEP=";"; fi
          ICON=""
          [ "$RUNNER_OS" = "Windows" ] && ICON="--icon python/blockle/assets/icon.ico"
          [ "$RUNNER_OS" = "macOS" ] && ICON="--icon python/blockle/assets/icon.icns"
          pyinstaller --noconfirm --clean --windowed --name BlockleWallet $ICON \
            --add-binary "chain/target/release/blockle-chain$EXE$SEP"blockle/bin \
            --add-data "python/blockle/assets/logo.png${SEP}blockle/assets" \
            --add-data "docs/arena-vectors.json${SEP}docs" \
            --collect-all coincurve \
            --collect-all nacl \
            --collect-all cffi \
            --collect-all cryptography \
            --hidden-import coincurve._cffi_backend \
            --hidden-import _cffi_backend \
            python/launcher.py

      - name: Smoke-test packaged chain binary
        shell: bash
        run: |
          EXE=""; [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          BUNDLED=$(find dist -name "blockle-chain$EXE" | head -1)
          test -n "$BUNDLED"
          "$BUNDLED" --help | head -3

      - name: Upload GUI bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.gui-artifact }}
          path: dist/

      # When dispatched with release_tag, attach this platform's GUI zip to the
      # release straight from the Action (GitHub's network) — avoids slow/flaky
      # local uploads. macOS ships ONLY the .app (not the redundant onedir, which
      # otherwise doubles the download size).
      - name: Attach GUI to release
        if: ${{ github.event.inputs.release_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          ZIP="${{ matrix.gui-artifact }}.zip"
          cd dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            zip -qr -9 "../$ZIP" BlockleWallet.app
          elif command -v zip >/dev/null 2>&1; then
            zip -qr -9 "../$ZIP" BlockleWallet
          else
            7z a -tzip "../$ZIP" BlockleWallet >/dev/null
          fi
          cd ..
          gh release upload "$TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Collect CLI binaries
        shell: bash
        run: |
          EXE=""; [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          mkdir -p cli-bin
          cp "target/release/blockle$EXE" "target/release/blockle-biz$EXE" \
             "chain/target/release/blockle-chain$EXE" cli-bin/

      - name: Upload CLI binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin-artifact }}
          path: cli-bin/

  # ── Promote a dispatched release to "Latest" ONLY once every download the site
  # links is actually attached. A release is cut as --prerelease, so GitHub's
  # "Latest" (= newest non-prerelease) stays on the previous COMPLETE release while
  # the desktop zips build — no 404 window on blockle.org/releases/latest/download.
  # This job runs after all 3 desktop legs upload their zip; if any required asset
  # is missing it fails and leaves the release as prerelease (latest never regresses).
  promote-release:
    name: promote release to latest
    needs: build
    if: ${{ github.event.inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mark release latest once all assets are attached
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          REQUIRED="BlockleWallet-linux-x86_64.zip BlockleWallet-macos-arm64.zip BlockleWallet-windows-x86_64.zip BlockleWallet-extension.zip BlockleWallet-android.apk"
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          echo "Attached assets:"; echo "$ASSETS"
          missing=0
          for a in $REQUIRED; do
            if ! echo "$ASSETS" | grep -qx "$a"; then echo "::warning::missing required asset $a"; missing=1; fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::not all required assets are attached — leaving $TAG as prerelease so 'Latest' stays on the previous complete release"
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          echo "Promoted $TAG to Latest — all $(echo $REQUIRED | wc -w) download assets present."

  # ── Agent stack: @blockle/agent-sdk (sdk/) + @blockle/mcp (mcp/) ──────────────
  # Both link the ML-DSA wasm signer (blockle-wasm/pkg-node), so build it first.
  agent-stack:
    name: sdk + mcp (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: blockle-wasm

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build wasm signer (nodejs target)
        run: cd blockle-wasm && wasm-pack build --target nodejs --out-dir pkg-node

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build + test SDK
        run: cd sdk && npm install && npm run build && npm test

      - name: Build + test MCP server
        run: cd mcp && npm install && npm run build && npm test

  # ── Browser extension (MV3, no bundler): node --check + unit tests ───────────
  extension:
    name: extension (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check every source file + run unit tests
        run: cd blockle-extension && npm run build

  # ── Payment-rail + exchange services: build / lint check ─────────────────────
  services:
    name: services build/lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: blockle-wasm

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build wasm signer (nodejs target)
        run: cd blockle-wasm && wasm-pack build --target nodejs --out-dir pkg-node

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: settlement — compile (tsc) + unit tests
        run: cd services/settlement && npm install && npm run build && npm test

      - name: x402-buy — install + syntax lint
        run: |
          cd services/x402-buy && npm install
          node --check index.js
          find src -name '*.js' -print0 | xargs -0 -I{} node --check {}

      - name: exchange relay — compile (tsc) + unit tests
        run: cd exchange/server && npm install && npm run build && npm test
