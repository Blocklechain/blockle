name: Blockle Idle iOS TestFlight

# Godot 4.7.2 / GDScript idle game. The iOS Xcode project is generated by Godot's
# headless iOS exporter, then archived UNSIGNED and distribution-signed at export
# with the App Store Connect API key (secrets ASC_KEY_*), bundle org.blockle.idle,
# team B87ALX4XW9 — the same cloud-signing flow as blockle-protect-ios.yml.
#
# IMPORTANT, done once by the account owner before the upload step can succeed:
#   The App Store Connect app record for org.blockle.idle must be created manually
#   (App Store Connect -> Apps -> + -> New App, Bundle ID org.blockle.idle). Same
#   requirement as Protect; altool cannot create the record, only upload to it.
#
# IMPORTANT, version coupling: the export templates .tpz MUST be the exact same
# version as the editor (4.7.2.stable). A mismatch makes the export silently fall
# back / fail, so GODOT_VERSION drives both downloads below.
on:
  workflow_dispatch: {}
  push:
    paths:
      - 'blockle-idle/**'
      - '.github/workflows/blockle-idle-ios.yml'

concurrency:
  group: blockle-idle-ios
  cancel-in-progress: false

env:
  # Editor version AND export-template version — keep them identical (see note above).
  GODOT_VERSION: 4.7.2-stable
  GODOT_DOTVER: 4.7.2.stable
  BUNDLE_ID: org.blockle.idle

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "$XC" ] && sudo xcode-select -s "$XC/Contents/Developer" || true
          xcodebuild -version

      # Editor + matching export templates are large and immutable per version, so
      # cache them keyed on the version string. A cache miss just re-downloads below.
      - name: Cache Godot editor + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/Library/Application Support/Godot/export_templates/${{ env.GODOT_DOTVER }}
          key: godot-${{ env.GODOT_VERSION }}-macos

      - name: Install Godot ${{ env.GODOT_DOTVER }} (editor + export templates)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -eo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          mkdir -p ~/godot-bin "$HOME/Library/Application Support/Godot/export_templates/${GODOT_DOTVER}"

          # Editor (universal macOS build ships as a .app inside a zip).
          curl -fL -o /tmp/godot_editor.zip "${BASE}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q -o /tmp/godot_editor.zip -d ~/godot-bin
          GODOT_APP="$(ls -d ~/godot-bin/Godot*.app | head -1)"
          ln -sf "$GODOT_APP/Contents/MacOS/Godot" ~/godot-bin/godot

          # Export templates (.tpz is a zip whose files live under a "templates/"
          # dir; they must land directly in the version folder Godot looks in).
          curl -fL -o /tmp/godot_templates.tpz "${BASE}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q -o /tmp/godot_templates.tpz -d /tmp/godot_templates
          cp -R /tmp/godot_templates/templates/. "$HOME/Library/Application Support/Godot/export_templates/${GODOT_DOTVER}/"

      - name: Godot sanity check
        run: |
          set -eo pipefail
          chmod +x ~/godot-bin/godot
          ~/godot-bin/godot --headless --version
          ls -1 "$HOME/Library/Application Support/Godot/export_templates/${GODOT_DOTVER}/" | head

      # First import may exit nonzero while generating .godot/ and resource imports;
      # that is expected. The second pass runs clean and settles the import cache.
      - name: Headless import
        run: |
          ~/godot-bin/godot --headless --path blockle-idle --import || true
          ~/godot-bin/godot --headless --path blockle-idle --import

      # Boot the project headless for a bit and fail if GDScript parse/runtime
      # errors show up on stderr — catches broken autoloads before we ship.
      - name: Smoke test (fail on script errors)
        run: |
          set -o pipefail
          ~/godot-bin/godot --headless --path blockle-idle --quit-after 180 2> >(tee /tmp/godot_smoke.err >&2) || true
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/godot_smoke.err; then
            echo "::error::GDScript errors detected during smoke test"
            exit 1
          fi
          echo "Smoke test clean."

      - name: Install App Store Connect API key
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      # Godot's iOS exporter emits an Xcode project (not an .ipa) that we then
      # archive and sign with Xcode, matching the Protect flow.
      - name: Export iOS Xcode project
        run: |
          set -eo pipefail
          mkdir -p blockle-idle/build/ios
          # The export path is resolved RELATIVE TO THE PROJECT (--path blockle-idle),
          # so pass a project-relative path (res://build/ios/...), not a repo-relative one.
          ~/godot-bin/godot --headless --path blockle-idle \
            --export-release iOS build/ios/BlockleIdle.xcodeproj
          ls -R blockle-idle/build/ios | head -40

      # Encryption-exemption declaration (App Store requires it); set it on the
      # generated Info.plist so TestFlight processing is not blocked. Also pin the
      # bundle id to org.blockle.idle regardless of what the preset emitted.
      - name: Patch Info.plist (encryption exemption)
        working-directory: blockle-idle/build/ios
        run: |
          set -eo pipefail
          # The APP Info.plist is named "<Target>-Info.plist" (e.g. BlockleIdle-Info.plist),
          # NOT "Info.plist" — the only files literally named Info.plist are the xcframeworks.
          # Godot's exporter also writes LANDSCAPE orientations here regardless of the portrait
          # preset, so we authoritatively rewrite them. Patch every app-level *-Info.plist.
          PLISTS="$(find . -name '*-Info.plist' -not -path '*xcframework*' -not -path '*.framework/*')"
          if [ -z "$PLISTS" ]; then echo "::error::no app Info.plist found"; find . -name '*.plist' | head; exit 1; fi
          for PLIST in $PLISTS; do
            echo "Patching $PLIST"
            /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool NO" "$PLIST"
            /usr/libexec/PlistBuddy -c "Delete :UIRequiresFullScreen" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool YES" "$PLIST"
            # Pin supported orientations to PORTRAIT ONLY (both device families).
            for K in UISupportedInterfaceOrientations "UISupportedInterfaceOrientations~ipad"; do
              /usr/libexec/PlistBuddy -c "Delete :$K" "$PLIST" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :$K array" "$PLIST"
              /usr/libexec/PlistBuddy -c "Add :$K:0 string UIInterfaceOrientationPortrait" "$PLIST"
            done
            echo "  -> $(/usr/libexec/PlistBuddy -c 'Print :UISupportedInterfaceOrientations' "$PLIST" | tr -d '\n')"
          done

      - name: Write ExportOptions.plist (distribution signing)
        working-directory: blockle-idle/build/ios
        run: |
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>B87ALX4XW9</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

      - name: Archive + export IPA (cloud-signed)
        working-directory: blockle-idle/build/ios
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          BN: ${{ github.run_number }}
        run: |
          set -eo pipefail
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_${KID}.p8"
          # Godot names the project/scheme after the project; detect it rather than
          # hardcode, so a rename doesn't silently break the archive.
          PROJ="$(ls -d *.xcodeproj | head -1)"
          SCHEME="$(xcodebuild -project "$PROJ" -list 2>/dev/null | awk '/Schemes:/{getline; gsub(/^ +/,""); print; exit}')"
          echo "Project: $PROJ  Scheme: $SCHEME"
          # Archive UNSIGNED — automatic signing at archive time would look for an iOS
          # *development* profile, which fails on a device-less team. Distribution
          # signing happens at export, where the ASC API key mints the App Store
          # cert + profile on demand.
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive \
            CURRENT_PROJECT_VERSION="$BN" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS"
          ls -lh build/ipa/*.ipa

      - name: Upload to TestFlight
        working-directory: blockle-idle/build/ios
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eo pipefail
          # altool authenticates with the ASC API key and is the authoritative check
          # that the app record exists. If org.blockle.idle has not been created in
          # App Store Connect yet, altool fails with "Cannot determine the Apple ID
          # from Bundle ID" — create it once (see header) and re-run. The signed IPA
          # is still kept as an artifact below.
          IPA="$(ls build/ipa/*.ipa | head -1)"
          OUT="$(xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$KID" --apiIssuer "$ISS" --verbose 2>&1 | tee /tmp/altool.log || true)"
          if ! grep -q "UPLOAD SUCCEEDED" /tmp/altool.log; then
            echo "::error::TestFlight upload did not report UPLOAD SUCCEEDED"
            exit 1
          fi
          echo "UPLOAD SUCCEEDED"

      - name: Upload IPA artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockle-idle-ipa
          path: blockle-idle/build/ios/build/ipa/*.ipa
          if-no-files-found: ignore
