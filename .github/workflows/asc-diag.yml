name: ASC Build Diagnostic

# One-off: query App Store Connect for the Blocklings app's builds + their
# processing state, so we can see why TestFlight isn't showing the build.
on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query App Store Connect
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m pip install --quiet pyjwt cryptography requests
          python3 - <<'PY'
          import os, time, base64, jwt, requests
          kid = os.environ['ASC_KEY_ID']; iss = os.environ['ASC_ISSUER_ID']
          key = base64.b64decode(os.environ['ASC_KEY_BASE64']).decode()
          now = int(time.time())
          tok = jwt.encode({'iss': iss, 'iat': now, 'exp': now+1000, 'aud': 'appstoreconnect-v1'},
                           key, algorithm='ES256', headers={'kid': kid, 'typ': 'JWT'})
          H = {'Authorization': 'Bearer ' + tok}
          B = 'https://api.appstoreconnect.apple.com/v1'
          # Find the app by bundle id.
          r = requests.get(B+'/apps', headers=H, params={'filter[bundleId]':'org.blockle.blocklings','limit':5})
          print('apps status', r.status_code)
          apps = r.json().get('data', [])
          for a in apps:
              print('APP', a['id'], a['attributes'].get('name'), a['attributes'].get('bundleId'))
          if not apps:
              print('!! NO APP found for bundleId org.blockle.blocklings — the app record is missing or has a different bundle id')
              raise SystemExit(0)
          app_id = apps[0]['id']
          # List builds.
          r = requests.get(B+'/builds', headers=H, params={'filter[app]':app_id,'limit':20,'sort':'-uploadedDate'})
          print('builds status', r.status_code)
          builds = r.json().get('data', [])
          print(f'--- {len(builds)} builds ---')
          for b in builds:
              at = b['attributes']
              print('BUILD', at.get('version'), '| processing:', at.get('processingState'),
                    '| expired:', at.get('expired'), '| uploaded:', at.get('uploadedDate'),
                    '| minOS:', at.get('minOsVersion'))
          # Pre-release versions (TestFlight groupings).
          r = requests.get(B+'/preReleaseVersions', headers=H, params={'filter[app]':app_id,'limit':10})
          print('preReleaseVersions', r.status_code, [v['attributes'].get('version') for v in r.json().get('data',[])])
          PY
