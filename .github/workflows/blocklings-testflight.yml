name: Blocklings iOS TestFlight

# Cloud iOS build + TestFlight upload for the Blocklings game (Flutter/Flame).
# Mirrors the wallet's ios-testflight.yml: headless distribution signing via the
# App Store Connect API key (secrets ASC_KEY_*), bundle id org.blockle.blocklings,
# team B87ALX4XW9. A best-effort `fastlane produce` step creates the App Store
# Connect app record on first run (the key needs App Manager; if it can't, create
# the "Blocklings" app once in App Store Connect and re-run).
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'blockle-quest/**'
      - '.github/workflows/blocklings-testflight.yml'

concurrency:
  group: blocklings-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (iOS 26 SDK required by App Store Connect)
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          [ -n "$XC" ] && sudo xcode-select -s "$XC/Contents/Developer" || true
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Install App Store Connect API key
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Ensure App Store Connect app record (best-effort)
        continue-on-error: true
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          export APP_STORE_CONNECT_API_KEY_KEY="$(echo "$ASC_KEY_BASE64" | base64 --decode)"
          export APP_STORE_CONNECT_API_KEY_IS_KEY_CONTENT_BASE64=false
          gem install fastlane -N || true
          fastlane produce create \
            --app_identifier org.blockle.blocklings \
            --app_name "Blocklings" \
            --language "English (U.S.)" \
            --team_id B87ALX4XW9 \
            --skip_itc false --skip_devcenter false || echo "produce failed — app record may already exist, or the key lacks App Manager."

      - name: Flutter deps
        working-directory: blockle-quest
        run: flutter pub get

      - name: Build + cloud-sign archive + export IPA
        working-directory: blockle-quest
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          BN: ${{ github.run_number }}
        run: |
          set -eo pipefail
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_${KID}.p8"
          flutter build ios --release --no-codesign --build-number="$BN"
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Runner.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          xcodebuild -exportArchive -archivePath build/Runner.xcarchive \
            -exportPath build/ipa -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS"
          ls -lh build/ipa/*.ipa

      - name: Upload to TestFlight
        working-directory: blockle-quest
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eo pipefail
          IPA="$(ls build/ipa/*.ipa | head -1)"
          echo "Uploading $IPA to TestFlight…"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$KID" --apiIssuer "$ISS" --verbose

      - name: Upload IPA artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blocklings-ipa
          path: blockle-quest/build/ipa/*.ipa
          if-no-files-found: ignore
