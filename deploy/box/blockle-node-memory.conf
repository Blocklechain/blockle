# Memory guard for blockle-node.service (the BLOCK mainnet node + 18 pools).
#
#   install:  mkdir -p /etc/systemd/system/blockle-node.service.d
#             cp blockle-node-memory.conf \
#                /etc/systemd/system/blockle-node.service.d/memory.conf
#             systemctl daemon-reload
#             # takes effect without a restart:
#             systemctl set-property blockle-node.service MemoryHigh=6G MemoryMax=10G
#
# WHY THIS FILE EXISTS, AND WHY THESE NUMBERS.
#
# The node reached 24.8 GB RSS on a 31 GB host that also runs the exchange, the
# custody services and three other coin daemons. systemd's accounting on that
# process: 26.9 G memory peak, 3.3 G swap peak. There were no limits of any
# kind on the unit, so the only thing standing between a node bug and the
# exchange becoming unreachable was luck.
#
# The cause is fixed in 0.8.0 — `Node::snapshot()` deep-copied the whole chain
# on every request, and glibc turned those transients into 236 permanently
# resident 64 MB malloc arena heaps. After the fix the same node, same 18
# pools, same ~113 threads, sits at ~3.9 GB. These limits are not the fix; they
# are what keeps the NEXT allocation bug from taking the box with it.
#
#   MemoryHigh=6G   soft. Past this the kernel applies reclaim pressure and
#                   throttles the cgroup rather than killing it. ~1.5x the
#                   observed plateau, so normal operation never touches it and
#                   crossing it is a signal, not a routine event.
#
#   MemoryMax=10G   hard. The cgroup is OOM-killed here, and Restart=on-failure
#                   brings it back. For a mining node that is recoverable: the
#                   chain is on disk and the pool ledgers are append-only. An
#                   exchange that cannot reach custody is not.
#
# Startup is the one thing to know before tightening these: the node replays
# and validates the whole chain single-threaded, about 15 minutes at 76k
# blocks, during which the pools and the explorer are down. A MemoryMax low
# enough to OOM at the tail of a restart would loop. 10G is far above the
# ~0.5 GB that the replay itself needs.

[Service]
MemoryHigh=6G
MemoryMax=10G
MemoryAccounting=yes
