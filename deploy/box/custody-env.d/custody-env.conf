# ONE SOURCE OF TRUTH FOR CUSTODY CONFIG.
#
# These services previously disagreed. The runners read
# /etc/blockle/exchange-bitgo.env (which carried BITGO_WALLET_PREFIX), the
# public API read /etc/blockle/secrets/bitgo.env (which did not), and the
# reconciler read NO EnvironmentFile at all — so it could never see
# RECONCILE_SOURCE or a BitGo credential however they were set.
#
# Wallet scoping that only half the services apply is worse than none: the
# halves then disagree about which coins belong to the exchange, inside a BitGo
# account shared with Perbug, Froge and personal use. The direction of that
# error (books below custody) is the one reconciliation tolerates, so it would
# hide a real shortfall rather than report one.
#
# No leading dash on purpose: if the custody credential file is missing, a
# custody service must fail loudly rather than start up blind.
[Service]
EnvironmentFile=/etc/blockle/secrets/bitgo.env
