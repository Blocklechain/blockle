#!/usr/sbin/nft -f
# -----------------------------------------------------------------------------
# Host firewall. Added by the 2026-11-25 security audit, which found no packet
# filter of any kind: ufw inactive, no nftables ruleset, so every 0.0.0.0 bind
# was reachable from the internet the moment it started listening.
#
# THE POINT IS DEFAULT-DENY, not closing any one port. Nothing currently
# listening is being taken away — the services below are all intentional. What
# changes is that the NEXT thing to bind 0.0.0.0 is not automatically public,
# which is the property that was missing.
#
# Deliberately NOT closed, and why:
#   8445/8455  BLOCK explorer HTTP. Read-only (no mutating or wallet endpoints,
#              verified), nginx does not front it, and it has a live external
#              consumer. Closing it would break somebody.
#   3001       eiquidus — the Perbug block explorer.
#   8402       blockle-x402 — the agent payment layer.
#   8080       an nginx listener.
# Those are separate products, outside the audited exchange. They are allowed
# here rather than silently cut off; whether they SHOULD be public is a
# question for their owners, not something a firewall change should decide.
#
# Coin RPC ports (19001-19007 etc.) are already bound to 127.0.0.1 and so are
# not listed: there is nothing to allow.
# -----------------------------------------------------------------------------

table inet filter {
	chain input {
		type filter hook input priority 0; policy drop;

		# Established flows first — this is what keeps outbound traffic working
		# and is why an ssh session does not die the moment the policy flips.
		ct state established,related accept
		ct state invalid drop

		iif lo accept

		# ICMP. Dropping it entirely breaks path-MTU discovery, which shows up
		# as mysterious stalls on large responses rather than as "no ping".
		ip protocol icmp icmp type { echo-request, echo-reply, destination-unreachable, time-exceeded, parameter-problem } accept
		ip6 nexthdr icmpv6 accept

		# --- administration ---------------------------------------------------
		# SSH. Rate-limited per source: a password-guessing flood is noise, and
		# the limit costs a legitimate operator nothing.
		tcp dport 22 ct state new limit rate 10/minute burst 5 packets accept
		tcp dport 22 accept

		# --- web --------------------------------------------------------------
		tcp dport { 80, 443 } accept
		tcp dport 8080 accept

		# --- mail (postfix + dovecot) -----------------------------------------
		# 25 must stay open to RECEIVE mail at all; 587 is submission.
		tcp dport { 25, 587, 143, 993 } accept

		# --- mining: stratum -------------------------------------------------
		# RANGES, not a list of the 30 ports in use today. A new pool lane that
		# a tight list silently blocked would look like "miners cannot connect"
		# with no obvious cause, and every port in these ranges is the same
		# class of service. BLOCK alone binds 18 lanes.
		tcp dport 3333-3347 accept
		tcp dport 3355-3382 accept

		# --- blockchain peer-to-peer -----------------------------------------
		# These MUST be inbound-reachable or the nodes only ever get outbound
		# peers, which is how ZEPH and NEOX ended up stuck.
		tcp dport { 9333, 9999, 18444, 18454, 22556 } accept
		tcp dport 19101-19107 accept

		# --- explorers / agent layer (see header) -----------------------------
		tcp dport { 3001, 8402, 8445, 8455 } accept
	}

	chain forward {
		type filter hook forward priority 0; policy drop;
	}

	chain output {
		type filter hook output priority 0; policy accept;
	}
}
