# Operator console configuration. NOT in the repository: the TOTP secret below
# is a credential, and a credential in git is a credential that has leaked.
#
# The allowlist is matched against the Blockle ACCOUNT ID first and the email
# second. Email is accepted for convenience; swap it for the account id once
# known, because an email can be changed at the accounts service and admin
# rights keyed on it would then silently follow or vanish.
[Service]
# AN ENVIRONMENT FILE, NOT Environment=, SO THE PREFLIGHT CAN SEE IT.
#
# golivecli runs from a SHELL and reads its own process environment. A
# systemd Environment= line is invisible to a shell, so the preflight
# reported "EXCHANGE_ADMINS is empty" and "no authenticator enrolled"
# while the running service had both correctly set. --flip refuses on
# that reading, so a gate that should open could not.
#
# Neither of these is a credential: an allowlist of account ids and a
# URL. The TOTP seed stays in its own 0600 file.
EnvironmentFile=/etc/blockle/exchange-admin.env
# THE ADMIN TOTP SEED IS A CREDENTIAL, so it is not an Environment=.
#
# systemd serves the parsed Environment= block over D-Bus to ANY local
# user. A readable TOTP seed means anyone on the box can generate valid
# admin codes, which defeats the per-mutation second factor entirely.
# It is empty today; this is wired BEFORE an operator enrols, because
# after would be too late.
EnvironmentFile=/etc/blockle/secrets/admin-totp.env
