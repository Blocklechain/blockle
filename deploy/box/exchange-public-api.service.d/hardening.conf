# Added by the 2026-11-25 security audit.
[Service]
# A MEMORY CEILING ON THE INTERNET-FACING SERVICE.
# Previously infinity. This box has form: the BLOCK node once reached 24.8 GB
# RSS and the host had to be rescued. A request flood or a leak in the only
# process strangers can reach should kill that process, not the machine.
MemoryHigh=1G
MemoryMax=2G
# NO CAPABILITIES AT ALL. Largely belt-and-braces for a non-root service with
# NoNewPrivileges, but the default was the FULL bounding set, and free is free.
CapabilityBoundingSet=
# Defence in depth around the same idea.
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
# The service speaks HTTP to localhost and TLS out to BitGo. Nothing else.
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
