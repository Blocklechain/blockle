# BitGo PRODUCTION credentials. Root-only, never in the repository.
#
# The account is SHARED with other projects (Perbug, Froge, a personal wallet),
# so BITGO_WALLET_PREFIX scopes exchange custody to wallets labelled for the
# exchange. Without it the holdings adapter refuses outright rather than
# counting someone else's coins as ours — see src/bitgo.ts.
#
# RECONCILE_SOURCE is deliberately NOT set yet: no exchange wallets exist on
# this account, so pointing reconciliation at BitGo would halt every asset,
# and it would also disable the faucet that currently funds test accounts.
[Service]
# SECRETS LIVE IN A FILE, NOT Environment=.
#
# systemd serves the PARSED Environment= block over D-Bus, so any local
# user could read these with `systemctl show -p Environment` — verified
# by reading the BitGo production token as `nobody`. A 0600 drop-in does
# not prevent that, because PID 1 hands the value out itself.
# EnvironmentFile= is read by PID 1 and never echoed back.
EnvironmentFile=/etc/blockle/secrets/bitgo.env
Environment="BITGO_WALLET_PREFIX=Blockle Exchange"
