# exchange.blockle.org — nginx server block
#
# Non-custodial atomic-swap relay (exchange/server, Node/Express on :8900,
# websocket fan-out at /stream) in front of the static frontend (exchange/web).
#
# The relay holds NO user funds; it relays signed swap intents and runs the HTLC
# state machine. All API routes live at the server root (/markets, /orders, ...)
# so this file proxies the known relay endpoints and serves everything else as
# static SPA files.
#
# ── Deploy ───────────────────────────────────────────────────────────────────
#   1. Copy to /etc/nginx/sites-available/exchange.blockle.org.conf and symlink
#      into sites-enabled/ (or drop into conf.d/). This file is a TEMPLATE —
#      do NOT overwrite live server config blindly.
#   2. Build + run the relay:   cd exchange/server && npm ci && npm run build
#      then `node dist/src/index.js` behind your process manager (port 8900).
#   3. Publish the frontend to the `root` path below (default /opt/blockle/exchange/web).
#   4. Obtain a TLS cert (certbot --nginx -d exchange.blockle.org) — the 443
#      block below assumes certbot-managed paths; adjust to your setup.
#
# COMPLIANCE: the relay keeps every money path disabled until an operator records
# a completed legal/compliance review (mainnetEnabled + legalReview.completed).
# This proxy does not change that — sign-off is required before mainnet.

upstream blockle_exchange_relay {
    server 127.0.0.1:8910;   # relay (8900 is taken by blockle-biz / the main site)
    keepalive 16;
}

upstream blockle_x402 {
    server 127.0.0.1:8402;   # x402 payment-rail service (/x402/buy|list|pay + manifest)
    keepalive 8;
}

# ── HTTP → HTTPS redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name exchange.blockle.org;

    # Allow ACME http-01 challenges before redirecting.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ───────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name exchange.blockle.org;

    # TLS (certbot-managed paths; adjust to your cert layout).
    ssl_certificate     /etc/letsencrypt/live/exchange.blockle.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exchange.blockle.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Security headers.
    add_header X-Content-Type-Options    nosniff            always;
    add_header X-Frame-Options           SAMEORIGIN         always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Static frontend lives here (publish exchange/web to this path).
    root /opt/blockle/exchange/web;
    index index.html;

    client_max_body_size 512k;
    access_log /var/log/nginx/exchange.blockle.org.access.log;
    error_log  /var/log/nginx/exchange.blockle.org.error.log;

    # ── WebSocket fan-out (live book / trades) ──────────────────────────────────
    location /stream {
        proxy_pass http://blockle_exchange_relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # long-lived socket
        proxy_send_timeout 3600s;
    }

    # ── x402 payment rail (buy / list / pay + discovery manifest) → :8402 ────────
    location ~ ^/(x402|x402-resources\.json)(/|$) {
        proxy_pass http://blockle_x402;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # ── Relay API (all routes live at the server root) ──────────────────────────
    location ~ ^/(healthz|auth|markets|book|trades|orders|swaps|listings)(/|$) {
        proxy_pass http://blockle_exchange_relay;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # ── Static SPA fallback (index.html, list.html, config.js, core.js, …) ──────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
