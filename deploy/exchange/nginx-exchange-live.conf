# -----------------------------------------------------------------------------
# exchange.blockle.org — the live exchange front page (interim home).
#
# WHY HERE AND NOT blockle.org YET. Taking over the root is an outward-facing,
# hard-to-reverse change to a site that is currently serving real users. This
# host, by contrast, was returning:
#
#     410 "Blockle Exchange has been discontinued."
#
# so putting the real thing here is strictly an improvement and reverses
# nothing. The root takeover (nginx-blockle.org.conf) is ready and stays
# un-enabled until a human decides to flip it.
# -----------------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=exlive:10m rate=600r/m;

# MONEY AND CREDENTIAL ROUTES GET THEIR OWN BUDGET.
#
# The global zone above is 600r/m, which is right for a trading UI polling a
# book but far too generous for authentication or for anything that moves
# funds. The 2026-11-25 audit found an authenticated scanner had made 139
# successful faucet calls inside the global limit without ever being throttled.
#
# Separate zones, because sharing one would let book polling exhaust the budget
# that protects the withdrawal route.
limit_req_zone $binary_remote_addr zone=exmoney:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=exauth:10m rate=30r/m;
# NOTE: the exchange has no login of its own — it delegates to the Blockle
# accounts service, proxied at /account/api/ here and at /account on
# blockle.org. THAT surface has no rate limit, which is where credential
# stuffing would actually be aimed. Scoping a limit to its credential routes
# (not all of /account, which the app polls heavily) is still outstanding.

# THROTTLED IS 429, NOT 503. nginx defaults limit_req to 503, which means
# "the service is down" — monitoring pages someone, and a client backs off as
# if the exchange had failed. 429 says "you, specifically, are going too fast",
# which is both true and actionable, and Retry-After tells a client when.
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name exchange.blockle.org;
    location /.well-known/acme-challenge/ { root /var/www/acme; }

    location / { return 301 https://$host$request_uri; }
}

server {
    # Plain `ssl`: another vhost already sets protocol options on :443 and they
    # are per-socket, so repeating http2 here only emits a warning.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name exchange.blockle.org;

    ssl_certificate     /etc/letsencrypt/live/exchange.blockle.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exchange.blockle.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # A venue page must never be framed — a clickjacked control is a real order.
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # No inline-script allowance beyond what the page needs; it has one inline
    # block and no external scripts at all, so this is tight by construction.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    limit_req zone=exlive burst=200 nodelay;

    # The API serves both the JSON and the static page, so one upstream.
    # ---- the accounts service, proxied so sign-in is SAME-ORIGIN ----------
    #
    # The exchange has its own sign-in page (signin.html) rather than bouncing
    # to blockle.org and back, which is where people give up. That page posts
    # here; because this is the same origin there is no CORS to configure and
    # no preflight to get wrong, and the session cookie the accounts service
    # sets is scoped to .blockle.org so it covers this host and the main site
    # at once.
    #
    # Only /account/api/ is proxied. The accounts service's own HTML pages stay
    # on blockle.org, so there is exactly one place to manage an account.
    location /account/api/ {
        proxy_pass http://127.0.0.1:8930;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;
        proxy_read_timeout 60s;
    }

    # Moving funds: 10/min. A human withdraws a handful of times a day; a
    # script emptying an account with a stolen session does it as fast as it
    # can. burst=3 absorbs a double-click, nothing more.
    location = /v1/withdrawals {
        limit_req zone=exmoney burst=3 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # The testnet faucet. Capped for the same reason, and because each call
    # also moves the declared treasury.
    location = /v1/testnet-fund {
        limit_req zone=exmoney burst=3 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # Credentials: login, registration and API-key minting. 30/min still allows
    # a fumbled password; it does not allow credential stuffing.


    location = /v1/api-keys {
        limit_req zone=exauth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location ~ /\. { deny all; return 404; }

    access_log /var/log/nginx/exchange.blockle.org.access.log;
    error_log  /var/log/nginx/exchange.blockle.org.error.log warn;
}
