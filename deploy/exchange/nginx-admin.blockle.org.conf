# -----------------------------------------------------------------------------
# admin.blockle.org — the exchange admin portal (TradeXPro AdminPortal, Laravel)
#
# THIS VHOST IS FUNDS-CRITICAL, and more so than it looks. The portal no longer
# approves withdrawals — those are automatic — but it can edit the VELOCITY CAPS
# and per-request limits, and those caps are now the only brake on an automated
# payout path. Whoever can change a cap can drain the venue. So this host is
# treated as more sensitive than the customer-facing exchange, not less.
#
# There is exactly ONE account (alex@blockle.org). A single-operator portal has
# no "other admins would notice" property, so the controls below are the only
# thing between a stolen password and the treasury.
# -----------------------------------------------------------------------------

# Login brute-force bucket. Deliberately tight: one human logs in here, so a
# limit that would be absurd for a public site is generous for this one.
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=admin_all:10m   rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name admin.blockle.org;
    # ACME stays on 80; everything else is redirected.
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # Plain `ssl`, no http2 here. The directive form (`http2 on;`) needs
    # nginx >= 1.25.1 and this box runs 1.24.0. The `listen ... http2` form
    # parses, but protocol options are per-LISTEN-SOCKET and another vhost on
    # this box already sets them for :443 — so repeating it only produced
    # "protocol options redefined" warnings while changing nothing. HTTP/2 is
    # still active on the socket.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.blockle.org;

    ssl_certificate     /etc/letsencrypt/live/admin.blockle.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.blockle.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:admin_ssl:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---------------------------------------------------------------------
    # IP ALLOWLIST.
    #
    # Commented out rather than left empty, because an allowlist containing
    # nothing silently denies everyone and an allowlist that is "on" but wide
    # open is worse than none at all — it reads as a control while being
    # decorative. Fill in the operator's address(es) and uncomment; keep a
    # second path in (the VPS itself, via SSH tunnel) so a changed home IP
    # does not lock the only admin out of their own exchange.
    #
    # allow 203.0.113.0/24;   # operator
    # allow 127.0.0.1;        # via `ssh -L 8443:127.0.0.1:443 blockle-box`
    # deny  all;
    # ---------------------------------------------------------------------

    root /var/www/exchange-admin/public;
    index index.php;

    # HSTS, long and with subdomains — this host should never be reachable
    # over plaintext again once it has been seen.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # An admin panel has no business being embedded, previewed, or indexed.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

    limit_req zone=admin_all burst=40 nodelay;

    client_max_body_size 16m;

    # KYC documents and similar are uploaded here; they must never be served
    # back as static files from the web root.
    location ~* ^/(storage|uploads)/.*\.(php|phtml|phar|html?|svg)$ { deny all; }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ---------------------------------------------------------------------
    # THE SETUP CONSOLE, before everything else.
    #
    # Placed ahead of the PHP handling deliberately: TradeXPro is not installed
    # yet, so `root /var/www/exchange-admin/public` does not exist and every
    # other location on this host would 404 or 502. The console has to work on
    # a host where the thing it installs is still absent.
    #
    # Remove this block (and disable exchange-bootstrap) once setup is done.
    # ---------------------------------------------------------------------
    location /setup/ {
        proxy_pass http://127.0.0.1:8099/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # The TradeXPro archive is a few hundred MB and streams in as a raw PUT.
        client_max_body_size 1024m;
        proxy_request_buffering off;
        # composer install and npm run build take minutes; the 60s default
        # would sever the request mid-install.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The login and password-reset endpoints get the tight bucket.
    location ~ ^/(login|admin/login|password/(reset|email)|two-factor) {
        limit_req zone=admin_login burst=3 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm-exchange-admin.sock;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120;
    }

    # Never serve dotfiles — .env is the one that matters.
    location ~ /\. { deny all; return 404; }

    access_log /var/log/nginx/admin.blockle.org.access.log;
    error_log  /var/log/nginx/admin.blockle.org.error.log warn;
}
