# -----------------------------------------------------------------------------
# admin.blockle.org — the exchange operator console
#
# WHAT CHANGED FROM THE FIRST VERSION OF THIS FILE. It used to front a Laravel
# admin portal (TradeXPro) over PHP-FPM. That portal was dropped: its framework
# is EOL, its money arithmetic runs through float-coerced bcmath helpers, and
# it brought its own account system alongside the one Blockle already has. The
# console it is replaced by is static HTML plus a JSON API in the custody
# service (src/adminapi.ts), so there is no PHP on this host at all.
#
# THIS VHOST IS FUNDS-CRITICAL, and more so than it looks. It does not approve
# withdrawals — those are automatic — but it can SWEEP FEE REVENUE and FUND GAS
# FLOATS, and it reports the venue's own position. Whoever reaches it learns
# exactly when a chain is about to stop paying out.
#
# WHAT ACTUALLY PROTECTS IT, in order of how much work each one does:
#
#   1. The Blockle account session, plus an operator ALLOWLIST BY ACCOUNT ID
#      held in the service's environment. An empty allowlist means nobody.
#   2. A fresh, single-use authenticator code on every mutation — not a 2FA
#      check at login followed by an hour of trust.
#   3. This file: TLS, an optional IP allowlist, rate limits, and no indexing.
#
# Nginx is the outermost layer and the weakest of the three, which is the right
# order: the controls that matter live where the money moves.
# -----------------------------------------------------------------------------

# One human uses this host, so a limit that would be absurd for a public site
# is generous here. The tighter bucket covers the mutating endpoints.
limit_req_zone $binary_remote_addr zone=admin_all:10m    rate=120r/m;
limit_req_zone $binary_remote_addr zone=admin_write:10m  rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name admin.blockle.org;
    # ACME stays on 80; everything else is redirected.
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # Plain `ssl`, no http2 here. The directive form (`http2 on;`) needs
    # nginx >= 1.25.1 and this box runs 1.24.0. The `listen ... http2` form
    # parses, but protocol options are per-LISTEN-SOCKET and another vhost on
    # this box already sets them for :443 — so repeating it only produced
    # "protocol options redefined" warnings while changing nothing. HTTP/2 is
    # still active on the socket.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.blockle.org;

    ssl_certificate     /etc/letsencrypt/live/admin.blockle.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.blockle.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:admin_ssl:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---------------------------------------------------------------------
    # IP ALLOWLIST.
    #
    # Commented out rather than left empty, because an allowlist containing
    # nothing silently denies everyone and an allowlist that is "on" but wide
    # open is worse than none at all — it reads as a control while being
    # decorative. Fill in the operator's address(es) and uncomment; keep a
    # second path in (the VPS itself, via SSH tunnel) so a changed home IP
    # does not lock the only admin out of their own exchange.
    #
    # allow 203.0.113.0/24;   # operator
    # allow 127.0.0.1;        # via `ssh -L 8443:127.0.0.1:443 blockle-box`
    # deny  all;
    # ---------------------------------------------------------------------

    # HSTS, long and with subdomains — this host should never be reachable
    # over plaintext again once it has been seen.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # An operator console has no business being embedded, previewed, or indexed.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    # The console is self-contained: no CDN, no webfont, no external anything.
    # `connect-src 'self'` is what stops a successful injection from posting the
    # venue's revenue — or a swept balance — somewhere else.
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    client_max_body_size 64k;   # JSON only; nothing is uploaded here
    server_tokens off;

    # ---- the console and its API ----------------------------------------
    #
    # Both proxy to the custody service on loopback. The service binds
    # 127.0.0.1 only, so this vhost is the sole route in from outside.

    # Mutations: the tighter bucket, and no buffering of the response so a
    # failure is seen immediately rather than after a timeout.
    location ~ ^/admin/api/(sweep|fund-gas)$ {
        limit_req zone=admin_write burst=3 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # THE COOKIE MUST REACH THE SERVICE. Admin identity is the ordinary
        # .blockle.org session, which the service forwards to the accounts
        # service — stripping it here would make every request anonymous and
        # every anonymous request a 404.
        proxy_set_header Cookie            $http_cookie;
        # And so must the authenticator code.
        proxy_set_header X-Admin-Totp      $http_x_admin_totp;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    location /admin/ {
        limit_req zone=admin_all burst=40 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie            $http_cookie;
        proxy_set_header X-Admin-Totp      $http_x_admin_totp;
        proxy_read_timeout 30s;
    }

    # The bare host goes to the console rather than 404ing, since that is the
    # only thing on this vhost.
    location = / { return 302 /admin/; }

    # EVERYTHING ELSE IS 404, including the paths the old Laravel portal used.
    # A stale bookmark to /login must not reach a backend at all.
    location / { return 404; }

    access_log /var/log/nginx/admin.blockle.org.access.log;
    error_log  /var/log/nginx/admin.blockle.org.error.log warn;
}
