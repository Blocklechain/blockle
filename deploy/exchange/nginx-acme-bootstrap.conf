# -----------------------------------------------------------------------------
# ACME-only vhost, for hostnames that do not have a certificate YET.
#
# THIS EXISTS TO BREAK A CHICKEN-AND-EGG DEADLOCK. The real admin vhost
# references /etc/letsencrypt/live/admin.blockle.org/fullchain.pem, so nginx
# cannot even parse it before that file exists:
#
#   cannot load certificate ... BIO_new_file() failed ... No such file
#
# And certbot --webroot cannot create the file, because the challenge needs
# nginx to already be answering :80 for that hostname.
#
# So this config is installed FIRST. It contains no `ssl_certificate` and no
# TLS listener at all, which means it loads on a host with no certs. It serves
# the ACME webroot, certbot succeeds, and only then is the real TLS vhost
# installed and this one removed.
#
# Install to /etc/nginx/sites-available/, symlink, reload, issue certs, then
# replace with the real vhosts.
# -----------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name admin.blockle.org coin.blockle.org;

    # The only thing this vhost does.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    # Everything else: say plainly what is happening rather than 404ing, since
    # an operator may well hit this URL during setup and wonder.
    location / {
        default_type text/plain;
        return 503 "Blockle: this hostname is being provisioned (no TLS certificate yet).\n";
    }
}
