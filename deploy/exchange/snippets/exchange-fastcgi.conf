# Shared FastCGI block for the exchange API, included by several location
# blocks. Factored out so the rate-limited auth path and the general API path
# cannot drift apart — the bug that produces is an auth endpoint quietly
# missing a header the rest of the API has.
#
# Install to /etc/nginx/snippets/exchange-fastcgi.conf

fastcgi_pass exchange_api;
fastcgi_index index.php;
fastcgi_split_path_info ^(.+\.php)(/.+)$;

include fastcgi_params;

fastcgi_param SCRIPT_FILENAME /var/www/exchange-api/public/index.php;
fastcgi_param DOCUMENT_ROOT   /var/www/exchange-api/public;
fastcgi_param HTTPS on;

# Laravel reads the client address from these; without them every customer
# appears to come from 127.0.0.1, which breaks rate limiting, geofencing, and
# the audit trail all at once.
fastcgi_param REMOTE_ADDR       $remote_addr;
fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
fastcgi_param HTTP_X_FORWARDED_PROTO https;

fastcgi_read_timeout 60;
fastcgi_buffers 16 16k;
fastcgi_buffer_size 32k;
