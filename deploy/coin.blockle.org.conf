# coin.blockle.org — public read-only chain data for the exchange coin nodes.
#
# Fronts coin-esplora (127.0.0.1:3070), which speaks the Esplora REST shape the
# wallets already use for Bitcoin and Litecoin:
#   /<coin>/address/:a   /<coin>/address/:a/utxo   POST /<coin>/tx   /<coin>/status
#
# Public on purpose: this is chain data plus a broadcast endpoint for
# already-signed transactions. coin-esplora issues an allowlist of RPCs and has
# no passthrough, so nothing here can reach a spending method.
server {
    server_name coin.blockle.org;
    location / {
        proxy_pass http://127.0.0.1:3070;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # scantxoutset walks the whole UTXO set, so give it room.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/coin.blockle.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/coin.blockle.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = coin.blockle.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name coin.blockle.org;
    return 404; # managed by Certbot


}