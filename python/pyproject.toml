[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blockle"
version = "0.2.6"
description = "Blockle — the universal deployment system for PoW mining pools. Python wrapper around the Blockle core."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
keywords = ["mining", "pool", "stratum", "proof-of-work", "blockchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: System :: Networking",
]

[project.optional-dependencies]
qt = ["PySide6>=6.6"]

[project.scripts]
blockle = "blockle.cli:main"
blockle-qt = "blockle.qtwallet:main"

[project.urls]
Homepage = "https://blockle.org"

[tool.setuptools.packages.find]
include = ["blockle*"]

[tool.setuptools.package-data]
blockle = ["assets/*.png", "assets/*.ico", "assets/*.icns"]
