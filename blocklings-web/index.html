        <h1>Blocklings — a free voxel MMORPG you play in your browser</h1>
        <p>Blocklings is a free, open-world voxel MMORPG you can play instantly in your browser — no download needed — and on iPhone, iPad and Android. Spawn into a hand-crafted continent of meadows, forests, deserts, volcanic wastes and frozen tundra, and make a hero that is truly yours.</p>
        <h2>What you can do in Blocklings</h2>
        <ul>
          <li><strong>Explore a huge world:</strong> 978 unique zones with real height and depth, waystones for fast travel, and offshore islands to discover.</li>
          <li><strong>Fight 1,000+ monsters:</strong> from gentle slimes to level-999 terrors, each zone guarded by a named mini-boss with one-of-a-kind loot.</li>
          <li><strong>Master 14 skills to level 999:</strong> five combat skills and nine professions — mining, woodcutting, fishing, farming, herbalism, blacksmithing, cooking, alchemy and tailoring — each with a deep talent tree.</li>
          <li><strong>Craft &amp; collect:</strong> forge hundreds of armor and weapon types across a dozen material tiers, and collect rare pets that fight at your side and mounts that make exploring a joy.</li>
          <li><strong>Your gear is yours:</strong> progress lives in the self-custody Blockle universe, and your rarest items can become true digital collectibles.</li>
        </ul>
        <p>Free to play, cross-device cloud save, no install.
          <a href="https://blocklings.blockle.org/">Play Blocklings free in your browser</a>,
          read more on the <a href="https://blockle.org/blocklings/">Blocklings website</a>, or get it on
          <a href="https://apps.apple.com/us/app/blocklings/id6834539372">the App Store</a>.</p>
      </main>
    </noscript>
