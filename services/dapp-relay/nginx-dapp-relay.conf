# Blockle dApp-connect relay — reverse proxy snippet.
# Include inside the blockle.org server{} block, BEFORE the generic `location /api/`
# route (so /api/dapp/ is matched first). The trailing slash on proxy_pass strips
# the /api/dapp prefix, so the service sees /session, /session/<id>, /health.
location /api/dapp/ {
    proxy_pass http://127.0.0.1:8791/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 15s;
}
