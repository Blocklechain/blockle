[package]
name = "blockle-miner"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Easy multi-algorithm CPU miner speaking Stratum v1 — pick an algorithm, point it at any stratum pool, and mine. Works with Blockle pools and any standard Bitcoin-family stratum pool (SHA-256d, Scrypt, X11, Blake2b/2s, Blake3)."
repository = "https://github.com/blocklechain/blockle"
homepage = "https://blockle.org"
readme = "README.md"
keywords = ["mining", "stratum", "proof-of-work", "sha256d", "scrypt"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]

[[bin]]
name = "blockle-miner"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
scrypt = { version = "0.11", default-features = false }
rs-x11-hash = "0.1"
blake2 = "0.10"
blake3 = "1"
num-bigint = "0.4"
num-traits = "0.2"
num_cpus = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
