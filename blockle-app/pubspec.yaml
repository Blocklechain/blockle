name: blockle_app
description: "Blockle — shop with crypto: post-quantum wallet, marketplace & dApp browser"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_inappwebview: ^6.1.5
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  http: ^1.2.2
  qr_flutter: ^4.1.0
  file_picker: ^8.1.2
  share_plus: ^10.1.2
  # In-app purchases: Apple StoreKit + Google Play Billing for the Copilot subscription.
  # Receipts are verified server-side (accounts service /iap/*), which is the source of truth.
  # Multi-chain crypto (secp256k1/keccak/ripemd160/sha/hmac/scrypt). Pure Dart.
  pointycastle: ^3.9.1
  # OS-level banners (iOS UNUserNotificationCenter + Android notifications) so a
  # bot's realized-profit ping reaches the user even with the app backgrounded.
  flutter_local_notifications: ^17.2.3
  # Rotatable 3D BLOCKLE logo (GLB) on the splash — Google <model-viewer> in a
  # webview, drag-to-rotate + auto-rotate. Model built in Blender from the vector mark.
  model_viewer_plus: ^1.9.3
  flutter_gemma: ^0.12.6
  path_provider: ^2.1.5
  image_picker: ^1.2.2
  # `blockle://dapp?req=…` deep links — an external app (the Blockle Idle game)
  # hands a CONNECT/MINT request to the wallet via the relay-poll handshake.
  # Handles both the cold-start initial link and links received while running.
  app_links: ^6.3.2
  # Device passcode / Face ID / Touch ID. Used to gate ERASING the app, which
  # is irreversible and otherwise reachable in two taps from the LOCK screen.
  # Authenticated with biometricOnly:false so the phone passcode is accepted
  # when biometrics are unavailable or fail.
  local_auth: ^2.3.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/icon/blockle_icon.png"
  adaptive_icon_background: "assets/icon/blockle_bg.png"
  adaptive_icon_foreground: "assets/icon/blockle_fg.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/engine/
    - assets/wasm/
    - assets/provider/
    - assets/icons/
    - assets/bots/
    - assets/model/
