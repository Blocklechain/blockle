name: blockle_app
description: "Blockle Wallet — post-quantum BLOCK wallet, explorer & dApp browser"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_inappwebview: ^6.1.5
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  http: ^1.2.2
  qr_flutter: ^4.1.0
  file_picker: ^8.1.2
  share_plus: ^10.1.2
  # Multi-chain crypto (secp256k1/keccak/ripemd160/sha/hmac/scrypt). Pure Dart.
  pointycastle: ^3.9.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/icon/blockle_icon.png"
  adaptive_icon_background: "assets/icon/blockle_bg.png"
  adaptive_icon_foreground: "assets/icon/blockle_fg.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/engine/
    - assets/wasm/
    - assets/provider/
    - assets/icons/
