[package]
name = "blockle-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for Blockle post-quantum (ML-DSA-44) keys, addresses, signing and transaction building — used by the browser-extension wallet."

[lib]
crate-type = ["cdylib"]

[dependencies]
blockle-core = { path = "../chain/crates/core" }
blockle-vm = { path = "../chain/crates/vm" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bincode = "1"
# Browser RNG for ML-DSA keygen/signing (crypto.getRandomValues via getrandom).
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
